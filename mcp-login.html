<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a"><title>Connect to Strap</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f5f5f5;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,420px);background:#111;border:1px solid #292929;border-radius:22px;padding:28px;box-shadow:0 24px 80px #0008}.mark{width:48px;height:48px;border-radius:15px;background:#e6f53a;color:#090909;display:grid;place-items:center;font-weight:900;font-size:25px}.muted{color:#a2a2a2;line-height:1.55}h1{font-size:25px;margin:20px 0 8px}label{display:block;font-size:13px;color:#bbb;margin:17px 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #343434;background:#080808;color:white;font:inherit;outline:none}input:focus{border-color:#e6f53a}button{width:100%;border:0;border-radius:12px;padding:14px;font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;cursor:pointer;margin-top:14px}.primary{background:#e6f53a;color:#080808}.secondary{background:#202020;color:#fff;border:1px solid #383838}.error{color:#ff8b8b;min-height:22px;margin-top:12px}.hidden{display:none}
</style></head><body><main class="panel">
<div class="mark">S</div><h1>Sign in to Strap</h1>
<p class="muted">Sign in to continue connecting your AI assistant to your Strap business. Your account stays protected by Strap.</p>
<form id="login-form">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="primary" id="submit" type="submit">Continue</button>
</form>
<button class="secondary" id="google" type="button">Continue with Google</button>
<p id="error" class="error" role="alert"></p>
<p class="muted" id="status">Secure sign-in powered by Neon Auth.</p>
</main>
<script type="module">
import { createAuthClient } from 'https://esm.sh/@neon/auth@0.8.2?bundle';
const auth=createAuthClient(location.origin+'/api/neon-auth');
const params=new URLSearchParams(location.search);
const mustSignInAgain=/\\b(login|create)\\b/.test(params.get('prompt')||'');
const pendingKey='strap:mcp-oauth-login-pending';
const error=document.getElementById('error'),status=document.getElementById('status');
const form=document.getElementById('login-form'),google=document.getElementById('google');
const message=e=>e instanceof Error?e.message:'Sign-in could not be completed.';
const continueOAuth=async()=>{
 const {error:resumeError}=await auth.oauth2.continue({selected:true});
 if(resumeError)throw resumeError;
};
(async()=>{
 try{
  const {data,error:sessionError}=await auth.getSession();
  if(sessionError)throw sessionError;
  const socialReturn=sessionStorage.getItem(pendingKey)==='1';
  if(socialReturn)sessionStorage.removeItem(pendingKey);
  if(data?.user&&(!mustSignInAgain||socialReturn)){
   await continueOAuth();
  }
 }catch(e){
  if(e?.status===400||e?.status===404){
   error.textContent='This connection request expired or is no longer valid. Return to Claude and connect again.';
   form.classList.add('hidden');google.classList.add('hidden');
  }else{
   status.textContent='We could not resume the connection. Check your internet connection and try again.';
   error.textContent=message(e);
  }
 }
})();
form.addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('submit');
 button.disabled=true;button.textContent='Signing in…';error.textContent='';
 try{
  const {data,error:signInError}=await auth.signIn.email({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(signInError)throw signInError;
  if(!data?.redirect)await continueOAuth();
 }catch(err){error.textContent=message(err);}
 finally{button.disabled=false;button.textContent='Continue';}
});
google.addEventListener('click',async()=>{
 error.textContent='';
 try{
  sessionStorage.setItem(pendingKey,'1');
  const result=await auth.signIn.social({provider:'google',callbackURL:location.href});
  if(result?.error){sessionStorage.removeItem(pendingKey);throw result.error;}
 }catch(err){sessionStorage.removeItem(pendingKey);error.textContent=message(err);}
});
</script></body></html>
