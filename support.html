<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6f53a"><title>Contact Strap Support</title>
<style>
:root{--lemon:#e6f53a;--black:#0a0a0a}*{box-sizing:border-box}body{margin:0;background:var(--lemon);color:var(--black);font-family:Inter,Arial,sans-serif;min-height:100vh;padding:24px 18px 40px}main{max-width:560px;margin:0 auto}.back{display:inline-flex;gap:8px;color:var(--black);font-weight:650;text-decoration:none;margin:12px 0 28px}h1{font-size:clamp(34px,9vw,48px);line-height:1.05;letter-spacing:-.055em;margin:0 0 12px}.lead{font-size:15px;line-height:1.65;color:#3e421e;margin:0 0 25px}form{background:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 50px #00000012}label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #e7e7e2;border-radius:13px;padding:15px 14px;font:inherit;font-size:15px;background:#fff;color:var(--black);outline:none;margin-bottom:17px}input:focus,select:focus,textarea:focus{border-color:var(--black);box-shadow:0 0 0 3px #e6f53a66}textarea{min-height:150px;resize:vertical;line-height:1.5}button{width:100%;border:0;border-radius:999px;padding:17px;background:var(--black);color:var(--lemon);font-weight:750;font-size:16px}button:disabled{opacity:.55}#status{font-size:13px;line-height:1.5;margin:14px 2px 0;min-height:20px}.fine{font-size:12px;color:#575a36;text-align:center;line-height:1.6;margin:18px 4px}.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
</style></head><body><main>
<a class="back" href="javascript:history.back()">← Back to Strap</a><h1>We’re here to help.</h1>
<p class="lead">Tell us what happened or what you need help with. Our support team will receive your message and reply to the email address you provide.</p>
<form id="support-form">
<div><label for="name">Your name</label><input id="name" name="name" maxlength="100" autocomplete="name" placeholder="Your name" required></div>
<div><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required></div>
<div><label for="kind">What do you need help with?</label><select id="kind" name="kind"><option>General support</option><option>Account and sign-in</option><option>Products and inventory</option><option>Sales and payments</option><option>Storefront and online orders</option><option>Report a problem</option><option>Feedback or suggestion</option><option>Other complaint</option></select></div>
<div><label for="message">Message</label><textarea id="message" name="message" maxlength="4000" placeholder="Describe your question or complaint..." required></textarea></div>
<div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<button id="send" type="submit">Send message</button><p id="status" role="status" aria-live="polite"></p></form>
<p class="fine">Your message is sent to Strap Support through FormSubmit. Please don’t include passwords, PINs or verification codes.</p>
</main>
<script src="api.js"></script><script>
(async()=>{const email=document.getElementById('email');try{const r=await StrapAPI.call('GET','me');if(r.ok&&r.email)email.value=r.email;}catch(e){}
document.getElementById('support-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status'),btn=document.getElementById('send');if(document.getElementById('website').value)return;btn.disabled=true;btn.textContent='Sending…';status.textContent='';
const r=await StrapAPI.contact(document.getElementById('kind').value,document.getElementById('message').value,email.value,document.getElementById('name').value);
btn.disabled=false;btn.textContent='Send message';if(!r.ok){status.textContent=r.msg||'We could not send your message. Please try again.';return;}
document.getElementById('support-form').reset();status.textContent='Your message has been sent. We’ll reply to your email.';});})();
</script></body></html>
