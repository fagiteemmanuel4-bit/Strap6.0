<style>
:root{--lemon:#e6f53a;--black:#0a0a0a;--mute:#8d8d86;--line:#ececea;--soft:#f3f3ee}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{font-family:Sora,"Helvetica Neue",Arial,sans-serif;background:var(--black);color:var(--black);min-height:100dvh;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
.page{max-width:640px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 14px}.back{width:46px;height:46px;border-radius:50%;border:1.5px solid #3a3a3a;background:none;color:#fff;font-size:22px;cursor:pointer}.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}.brand b{font-size:19px;letter-spacing:-.04em}.sheet{background:#fff;border-radius:34px 34px 0 0;min-height:calc(100dvh - 78px);padding:8px clamp(18px,5.5vw,26px) calc(env(safe-area-inset-bottom,0px) + 48px);animation:up .55s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(35px);opacity:0}}
.hero{text-align:center;padding:18px 0 4px}.orb{width:132px;height:132px;margin:auto auto 18px;border-radius:50%;background:var(--lemon);display:grid;place-items:center;font-size:58px;color:var(--black)}h1{font-size:clamp(30px,8vw,40px);line-height:1.1;letter-spacing:-.05em;font-weight:600}.hero h1 span{background:linear-gradient(transparent 62%,var(--lemon) 62%)}.hero p{margin:12px auto 0;max-width:420px;font:15px/1.65 Inter,Arial,sans-serif;color:#55554f}
.find{position:relative;margin-top:22px}.find svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);pointer-events:none}.field{width:100%;border:2px solid var(--black);border-radius:999px;background:#fff;padding:16px 22px 16px 52px;font:500 15px Sora,Arial;color:var(--black);outline:none}.tabs{display:flex;gap:6px;overflow-x:auto;margin:24px -3px 0;padding:0 3px 5px;scrollbar-width:none}.tabs button{flex:none;border:0;border-radius:999px;background:none;padding:11px 17px;color:#6f6f69;font-size:13px;cursor:pointer}.tabs button[aria-selected=true]{background:#efefec;color:var(--black);font-weight:700}.view{padding-top:4px;animation:fade .25s ease}@keyframes fade{from{opacity:.5;transform:translateY(8px)}}
h2.section-title{font-size:21px;letter-spacing:-.03em;font-weight:600;margin:28px 0 13px}.sub{font:14px/1.65 Inter,Arial,sans-serif;color:#55554f;margin:-4px 0 15px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);border-radius:22px;background:#fff;text-align:left;box-shadow:0 12px 28px -22px #0a0a0a66;cursor:pointer;min-height:124px}.cat:active{transform:scale(.98)}.cat .ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:21px}.cat b{font-size:14px;line-height:1.3}.cat small{font:12px/1.4 Inter,Arial,sans-serif;color:var(--mute)}
.steps{margin-top:22px;padding:20px;border-radius:25px;background:var(--black);color:#fff}.steps h3{font-size:18px;margin-bottom:13px}.steps ol{list-style:none;display:grid;gap:12px;counter-reset:step}.steps li{display:flex;gap:12px;align-items:flex-start;font:13px/1.55 Inter,Arial,sans-serif;color:#d8d8d2;counter-increment:step}.steps li:before{content:counter(step);flex:none;width:28px;height:28px;border-radius:50%;background:var(--lemon);color:var(--black);font-weight:800;display:grid;place-items:center}.steps b{display:block;color:#fff;font:600 14px Sora,Arial}
.row{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:12px 16px;border:0;border-top:1px solid #f1f1ed;background:#fff;color:var(--black);text-align:left;text-decoration:none;cursor:pointer}.rows{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}.row:first-child{border-top:0}.row .rowico{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--soft)}.row span:nth-child(2){flex:1}.row b{display:block;font-size:14px}.row small{display:block;margin-top:3px;color:var(--mute);font:12px Inter,Arial,sans-serif}
.article-crumb{display:flex;gap:8px;align-items:center;margin:20px 0;color:#85857d;font-size:12px}.article-crumb button{border:0;background:none;color:#292920;font-weight:700;cursor:pointer}.article-head{padding:10px 0 20px;border-bottom:1px solid var(--line)}.kicker{font-size:10px;font-weight:800;letter-spacing:.13em;color:#77786d}.article-head h1{font-size:clamp(28px,7vw,38px);margin:10px 0 12px}.article-intro{font:15px/1.7 Inter,Arial,sans-serif;color:#55554f}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.meta span{background:#f0f1df;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700}
.toc{display:grid;gap:10px;margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:22px;background:#fafaf6}.toc b{font-size:13px}.toc a{font:13px/1.5 Inter,Arial,sans-serif;color:#45453e;text-decoration:none}.toc a:before{content:"↳";color:#85857d;margin-right:8px}
.article{font-family:Inter,Arial,sans-serif;color:#383830}.article>p{font-size:15px;line-height:1.8;margin:20px 0}.article section{scroll-margin-top:18px;padding:16px 0 18px;border-bottom:1px solid #efefe9}.article h2{font:600 19px/1.35 Sora,Arial,sans-serif;letter-spacing:-.03em;color:#10100d;margin-bottom:10px}.article p,.article li{font-size:14px;line-height:1.85;color:#4a4a42}.article p+p{margin-top:10px}.article ul{padding-left:20px;margin-top:8px}.faq{padding:22px 0 4px}.faq h2{font:600 19px Sora,Arial,sans-serif;margin-bottom:10px}.faq details{border-bottom:1px solid var(--line);padding:13px 0}.faq summary{font:600 13px/1.55 Sora,Arial,sans-serif;cursor:pointer}.faq details p{font:13px/1.7 Inter,Arial,sans-serif;color:#55554f;padding-top:8px}
.helpbox{margin:22px 0;padding:20px;border-radius:24px;background:var(--black);color:#fff}.helpbox b{font-size:16px}.helpbox p{font:13px/1.7 Inter,Arial,sans-serif;color:#d0d0c8;margin:8px 0 15px}
.pill{width:100%;min-height:54px;border:2px solid var(--black);border-radius:999px;background:var(--black);color:var(--lemon);font-weight:700;font-size:14px;cursor:pointer;padding:13px 18px}.pill:disabled{opacity:.5}.pill.alt{background:#fff;color:var(--black)}
.related{display:grid;gap:8px}.related button{display:flex;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:13px;font-weight:600;text-align:left}
.form{border:1px solid var(--line);border-radius:26px;padding:20px;margin-top:16px}.form label{display:block;margin:15px 0 7px;font-size:12px;font-weight:700}.form input,.form textarea,.form select{width:100%;border:1.5px solid var(--line);border-radius:14px;background:#fbfbf8;padding:14px;font:14px Inter,Arial,sans-serif}.form textarea{min-height:130px;resize:vertical;line-height:1.6}.form .hint{font:11px/1.5 Inter,Arial,sans-serif;color:var(--mute);margin-top:6px}.status{min-height:20px;margin-top:10px;font:13px/1.5 Inter,Arial,sans-serif;color:#426329}.status.error{color:#b13b2d}
.dot{width:10px;height:10px;border-radius:50%;background:#2fbf71}.dot.warn{background:#ffb84d}.dot.down{background:#ff5a4d}
.foot{text-align:center;margin-top:32px;color:var(--mute);font:12px/1.8 Inter,Arial,sans-serif}.foot a{color:var(--black);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:var(--black);padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:13px}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.sheet{border-radius:34px;margin-bottom:40px;min-height:0}.cats{gap:12px}}@media(max-width:360px){.cats{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<section class="hero" id="hero"><div class="orb" aria-hidden="true">✳</div><h1>How can we <span>help?</span></h1><p>Search our guides, browse by topic, or talk to the Strap Support team.</p></section>

<script>
(() => {
const articles={
start:{title:"Getting started with Strap",desc:"Set up your business, add your first products and build a simple routine for recording accurate sales.",sections:[
["Set up your business profile","<p>After creating your account, complete the business details requested during setup. Use the name customers recognise, choose the currency you actually use and select the business mode that most closely describes how your shop operates. These choices help Strap organise the tools and records you see. Do not enter made-up details just to complete a field. If a choice does not fit your business, ask support before relying on it.</p>"],
["Build your first catalogue","<p>Start with the products you sell most often. Give each item a clear name, an accurate selling price and the correct opening quantity if you track stock. Add a photo when it helps staff identify the item. Search before creating a new record so you do not accidentally add duplicates. If you already have a spreadsheet, prepare it with clear column headings, one product per row and prices as plain numbers without currency symbols. Keep a backup copy and review imported records before using them for live sales.</p>"],
["Make a test sale and prepare your routine","<p>Open Sales, add a product, confirm the quantity and total, then choose the payment type that matches what happened. Check the receipt before completing the transaction. A test helps you learn the checkout flow before serving a waiting customer. Do not record a fake sale just to populate your dashboard. Once ready, check stock before opening, confirm the active branch, use individual staff logins and review sales regularly. You can improve settings as the business grows; a small accurate setup is better than a large setup filled with guesses.</p>"]],
faqs:[["Can I change setup details later?","Many preferences can be revisited in Settings. Check the effect of a change before saving, especially for currency or business mode."],["Do I need to add every product immediately?","No. Start with the products you sell most often, then add the rest as you build your catalogue."]]},
sales:{title:"Sales and receipts",desc:"Record transactions accurately, manage interrupted checkouts and keep receipts and sales history useful.",sections:[
["Build and check the basket","<p>Open Sales and add products by searching, selecting them or scanning a barcode where available. Confirm the product and quantity before moving to payment. If an item is missing from the catalogue, add or correct its record first where practical so the sale can be connected to the right product. Check discounts, quantities and the final total with the customer. If you work across branches, confirm that the correct branch is active before completing the sale.</p>"],
["Record the payment honestly","<p>Choose the payment option that reflects what the customer actually used. Do not mark an unpaid balance as cash received. If the customer will pay later and the credit option is available, record the transaction as credit and attach it to the correct customer. This makes the outstanding amount easier to follow up. For unusual or split payments, use the options displayed in the checkout rather than forcing the transaction into a payment type that does not match what happened.</p>"],
["Hold a sale and manage receipts","<p>Hold sale parks the current basket when a customer needs time or you must serve someone else. It is not a completed sale and should not be counted as money received. Resume it later and check the items and quantities before finishing checkout. Receipt settings let you review the business details and information customers see. Keep the store name and contact details accurate, use the preview before changing the design and avoid displaying personal information customers do not need.</p>"],
["Review sales history","<p>Use sales history and reports to understand patterns. Check the date range and branch before interpreting totals. If a figure looks unexpected, inspect the transactions behind it instead of assuming the report is wrong. Note the date, branch, transaction and expected amount if you need help. This makes support investigations faster and reduces the risk of repeating or changing a transaction unnecessarily.</p>"]],
faqs:[["Does Hold sale complete a transaction?","No. It temporarily saves the basket so you can return to it. Complete checkout only when the customer and payment details are ready."],["How do I record money a customer will pay later?","Use the credit option when available and link the sale to the correct customer. Do not record it as cash received."]]},
stock:{title:"Products and stock",desc:"Maintain a reliable catalogue, import product lists carefully and investigate stock differences.",sections:[
["Create accurate product records","<p>When adding a product, enter a name staff can recognise, its selling price and the quantity currently on hand if inventory tracking is enabled. Add a category or photo when it helps people find the right item. Avoid creating duplicates with slightly different spellings; search first. If an item comes in different sizes, colours or packages, use the product options available in your current setup so each sellable choice can be identified correctly.</p>"],
["Prepare imports before uploading","<p>For a bulk import, use a spreadsheet or CSV with one product per row and clear column headings. Keep prices as plain numbers without currency symbols. Check that quantities are numeric, names are not blank and there are no accidental duplicate rows. Save a backup of the original file. After importing, review a sample of records in Products and confirm names, prices and quantities before using the catalogue for live sales. If the import reports a problem, correct the source file and try again rather than fixing many mistakes one by one.</p>"],
["Keep stock quantities trustworthy","<p>Update stock when deliveries arrive, stock is moved or a physical count reveals a difference. Record the real quantity on the shelf, not an estimate. Low-stock alerts are useful only when opening quantities and later adjustments are kept current. Treat an alert as a prompt to check the shelf and reorder, not proof that an item is already unavailable. If an item is not tracked, do not treat its displayed quantity as a reliable availability promise.</p>"],
["Manage branch transfers and differences","<p>Confirm the active location before adjusting stock. A transfer should represent stock physically moving from one branch to another. Check both locations after the transfer. When a system quantity differs from a physical count, recount the item and review recent sales, deliveries and transfers. Note the date, branch, product and expected quantity before making a correction. This creates a clear trail for your own records and gives support useful information if the difference remains unexplained.</p>"]],
faqs:[["What if an import has incorrect prices?","Pause use of the affected records, compare them with your source spreadsheet and correct them. Keep the original file as a reference."],["Why might branch stock differ?","Incorrect opening counts, unrecorded transfers, delayed updates or the wrong active branch can contribute. Check each location and recent movements."]]},
team:{title:"Branches and staff",desc:"Organise locations, give staff individual access and protect sensitive business actions.",sections:[
["Use branches for real locations","<p>A branch represents a shop, outlet or business location that needs its own sales and stock context. Give it a name staff can recognise. Before recording a sale or adjusting inventory, check that the correct branch is active. This prevents records from being assigned to the wrong location. Do not create duplicate branches to separate shifts or people; use staff and role controls for team members and branch controls for locations.</p>"],
["Give every person their own login","<p>Add staff through the staff settings available in your account. Use the person's correct name and email, assign their working branch and choose the role that matches their responsibilities. Ask each person to use their own login rather than sharing the owner's password. Individual access makes it easier to understand who performed an action and lets you remove one person's access without disrupting everyone else. When someone leaves or no longer needs access, review and remove their account promptly.</p>"],
["Follow least-privilege access","<p>Give staff only the permissions needed for their job. A cashier may need to record sales but not change account settings; a manager may need wider operational access. Review the role descriptions shown in the app because permissions can depend on your setup and plan. Never share passwords, one-time codes or an Activity PIN in a group chat. If a team member needs access, create or invite their own account through the proper flow.</p>"],
["Review your team as things change","<p>If Activity PIN is enabled, keep it known only to people authorised to approve protected actions. Keep recovery information private. Remove access when a staff member leaves, update branch assignments when people move, review roles when responsibilities change and sign out shared devices when they are not in use. If you reach a plan limit for staff or branches, check the Plan screen for the current limit and available options rather than creating duplicate accounts.</p>"]],
faqs:[["Can staff share one login?","It is safer to give each person their own account. Shared logins make activity harder to trace and access harder to revoke."],["What if a staff member changes branch?","Update their branch assignment in staff settings and remind them to check the active branch before working."]]},
online:{title:"Online store",desc:"Prepare a trustworthy catalogue, understand online orders and keep storefront availability aligned with real stock.",sections:[
["Prepare products before publishing","<p>Review the products you want customers to see. Use recognisable names, accurate prices and clear photos. Descriptions should explain what the item is, its size or variant and important details a buyer needs before ordering. Avoid exaggerated claims or information you cannot verify. Check quantities and availability. If you do not track stock for an item, make sure your fulfilment routine confirms availability before promising it to a customer.</p>"],
["Review the storefront experience","<p>Choose a store name customers can connect with your business. Review the preview on a phone as well as a larger screen. Product photos should be clear, descriptions easy to scan and prices visible. Remove outdated products and correct spelling or price mistakes before sharing the link. Make delivery or collection arrangements clear before taking orders, and explain how customers can contact the business if they have a question.</p>"],
["Review each order before fulfilment","<p>When an order arrives, check the items, quantities, customer contact details and delivery or collection information shown. Do not assume an order has been paid simply because it appears in the order list; check the payment status displayed by the system. Keep order statuses accurate as work progresses. If an item is unavailable, contact the customer and agree on the next step rather than silently substituting a different product.</p>"],
["Keep online and counter stock aligned","<p>When the same product can be sold online and in person, stock accuracy matters. Record counter sales promptly and check online orders before promising the same remaining unit to another customer. If your workflow does not automatically reserve stock, use a manual availability check to avoid overselling. Use genuine photos, accurate prices, clear delivery expectations and prompt updates when an order is delayed or changed. A short weekly review of prices, photos, availability and order handling can prevent avoidable complaints.</p>"]],
faqs:[["Where should I check new orders?","Use the Orders area available in your current Strap setup and review the order and payment status before fulfilment."],["What if an item is out of stock after an order arrives?","Contact the customer, explain the issue and agree on a suitable resolution. Keep the order status accurate."]]},
plan:{title:"Plans and billing",desc:"Review plan limits, subscription details and payment terms before confirming a billing change.",sections:[
["Check what your plan includes","<p>Open the Plan or subscription area in Settings and read the features and limits shown for your account. Limits may apply to products, branches or staff. Use the wording currently shown in the app rather than relying on an old screenshot or a price mentioned elsewhere. If you are approaching a limit, check which records use it and whether you need more capacity. Do not delete important business records just to make room without understanding the consequences.</p>"],
["Read the full price before subscribing","<p>Before confirming a subscription, check the amount, currency, billing period and any introductory offer terms. If a discounted period is shown, check when it ends and what price applies afterwards. The payment screen should make the amount and renewal arrangement clear before you approve it. Never send your card number, CVV, password or one-time code to support in a message. Use only the payment flow presented inside your authenticated Strap experience.</p>"],
["Keep billing details current","<p>Use an email address and phone number that the account owner can access. Billing notices and verification messages are useful only if they reach the right person. If your business contact details change, update them in the appropriate account settings and complete any verification requested.</p>"],
["Understand renewals and ask for help","<p>Review the renewal date and the instructions shown for changing or ending a plan. If you are unsure whether a change takes effect immediately or at the next billing period, check the confirmation screen or ask support before proceeding. Save your payment confirmation for bookkeeping. If a payment fails, check the reason before repeatedly trying different cards. For an unexpected limit or billing status, send support the account email, plan label, date and a short explanation. Never include full payment credentials.</p>"]],
faqs:[["Where can I see the current Premium price?","Check the Plan screen in your Strap account. It is the authoritative place for the price and terms currently offered."],["Should I share card details with support?","No. Never send full card details, CVV, passwords or verification codes in a support message."]]},
security:{title:"Account and security",desc:"Protect your Strap account with strong credentials, verification, recovery planning and safe staff access.",sections:[
["Use a unique password","<p>Choose a password you do not use on social media, email or another service. A longer passphrase made from unrelated words can be easier to remember and harder to guess than a short password with predictable substitutions. Do not share it with staff; each person should use their own account. If you think someone else knows your password, change it in account security settings and secure the email account used for Strap too.</p>"],
["Enable additional verification","<p>If two-factor authentication is available in your account, follow the setup instructions and store recovery information somewhere private. A second verification step can help protect the account if a password is exposed. Never tell another person a one-time code, even if they claim to be support. Be cautious of messages that pressure you to act quickly, ask you to open an unfamiliar link or request a code. Open Strap directly through your usual app or website instead.</p>"],
["Keep recovery details current","<p>Use a backup email or phone that you personally control and can access. Check that it is typed correctly and complete any verification required. Avoid using another person's contact details as your recovery method; that can make it difficult to prove account ownership later. If you lose access to your email or phone, recover that service first where possible, then use Strap's official recovery flow.</p>"],
["Protect shared devices and report concerns","<p>On a phone used by several people, lock the device and sign out when appropriate. Give staff individual accounts and remove access when their role ends. Keep the Activity PIN private if your account uses one. If you see an unfamiliar sign-in, unexpected account change or verification messages you did not request, secure your email and Strap password, review staff access and contact support. Include the time and device, but never include a password, PIN or OTP. If an account is under review, use the in-app review request flow instead of creating another account to bypass the restriction.</p>"]],
faqs:[["Will support ask for my password or OTP?","No. Do not share passwords, Activity PINs or one-time verification codes with anyone claiming to help."],["What if I lose my recovery email?","Recover access to that email provider first if possible, then use Strap's official recovery options and contact support if needed."]]},
fix:{title:"Troubleshooting",desc:"Safely diagnose common sign-in, scanning, performance and reporting issues before contacting support.",sections:[
["Check your connection before retrying","<p>Confirm that your phone has a working internet connection by opening another trusted website. If the connection is unstable, wait until it improves before retrying a sale or stock change. Close and reopen the Strap page if it appears frozen, then sign in again if asked. Before refreshing during checkout, check whether the sale was already completed. Look in sales history first so you do not accidentally record the same transaction twice.</p>"],
["Fix barcode scanning problems","<p>Allow camera access for the browser, clean the camera lens and scan in steady light. Hold the barcode flat and keep the phone still while it focuses. If the code is damaged or will not scan, search for the product by name and confirm that you selected the correct item. If camera permission was denied earlier, open your device or browser site settings and allow camera access for Strap. Reload the page after changing the permission.</p>"],
["Investigate unexpected figures","<p>Check the active branch and date range first. A different branch or reporting period can change totals without anything being wrong. Compare the summary with the individual sales or stock records that contribute to it. Confirm whether the figure represents gross sales, payments received, credit or another measure. For stock differences, recount the item and review recent deliveries, sales and transfers.</p>"],
["Handle slow pages and report clearly","<p>Close unused browser tabs, check that your browser is up to date and try again on a stable connection. If one page repeatedly fails, note the page name and the action immediately before the problem. Avoid clearing all browser data as a first step because it can remove useful session information and sign you out. When contacting support, include the page, time, device and browser, steps followed, exact error text and what you expected. Add a screenshot only if it does not expose customer data, passwords, PINs or verification codes.</p>"]],
faqs:[["Should I retry a sale if the screen freezes?","First check sales history to see whether the sale was completed. Retry only after confirming it was not recorded."],["What information helps support fix a problem?","The page, timestamp, device/browser, steps to reproduce, exact error message and expected result are useful starting details."]]}}
const categories=[["start","Getting started","book","Set up in minutes"],["sales","Sales and receipts","receipt","Selling and credit"],["stock","Products and stock","inventory","Items, imports, alerts"],["team","Branches and staff","users","Your people and places"],["online","Online store","store","Sell beyond the counter"],["plan","Plans and billing","flash","Plans and subscriptions"],["security","Account and security","shield","Passwords and privacy"],["fix","Troubleshooting","gear","When something is off"]];
const icons={book:"▤",receipt:"▧",inventory:"▦",users:"♙",store:"⌂",flash:"ϟ",shield:"⬡",gear:"⚙"};
const $=s=>document.querySelector(s),view=$("#view"),search=$("#search"),toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2400)};
let activeTab="help",schemaNode=null;
const safe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tabs(){document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===activeTab)))}
function home(push=true){if(push)history.pushState({}, "", "support.html");if(schemaNode){schemaNode.remove();schemaNode=null}document.title="Strap – Help Centre";activeTab="help";tabs();$("#hero").hidden=false;search.hidden=false;renderHome();window.scrollTo(0,0)}
function renderHome(){const q=search.value.trim().toLowerCase();const matches=categories.filter(([id,n,,d])=>!q||(n+" "+d+" "+articles[id].desc+" "+articles[id].sections.map(s=>s.join(" ")).join(" ")).toLowerCase().includes(q));view.innerHTML=(q?"":'<section class="steps"><h3>Up and selling in four steps</h3><ol><li><span><b>Add your products</b>Type them in or import a list.</span></li><li><span><b>Design your receipt</b>Review it in Settings → Sales receipt.</span></li><li><span><b>Make your first sale</b>Add items, check the total and finish checkout.</span></li><li><span><b>Invite your team</b>Give each person their own login.</span></li></ol></section>')+'<h2 class="section-title">'+(q?"Matching help topics":"Browse by topic")+'</h2><div class="cats">'+matches.map(([id,n,ico,d])=>'<button class="cat" data-article="'+id+'"><i class="ico">'+icons[ico]+'</i><b>'+n+'</b><small>'+d+'</small></button>').join("")+'</div>'+(matches.length?'':'<p class="sub">No topic matches that search. Contact support and tell us what you need.</p>')+'<h2 class="section-title">Still need help?</h2><button class="pill" data-contact>Message Strap Support</button>'}
function article(id,push=true){const a=articles[id];if(!a)return home();if(push)history.pushState({article:id},"","support.html?article="+encodeURIComponent(id));activeTab="help";tabs();$("#hero").hidden=true;search.hidden=true;document.title=a.title+" | Strap Help Centre";const count=(a.title+" "+a.desc+" "+a.sections.map(s=>s.join(" ").replace(/<[^>]*>/g," ")).join(" ")).trim().split(/\s+/).length;const toc=a.sections.map((s,i)=>'<a href="#section-'+i+'">'+safe(s[0])+'</a>').join("");const body=a.sections.map((s,i)=>'<section id="section-'+i+'"><h2>'+safe(s[0])+'</h2>'+s[1]+'</section>').join("");const faq=a.faqs.map(([q,v])=>'<details><summary>'+safe(q)+'</summary><p>'+safe(v)+'</p></details>').join("");view.innerHTML='<nav class="article-crumb" aria-label="Breadcrumb"><button data-home>Help centre</button><span>/</span><span>'+safe(categories.find(c=>c[0]===id)[1])+'</span></nav><header class="article-head"><p class="kicker">STRAP HELP GUIDE · '+count+' WORDS</p><h1>'+safe(a.title)+'</h1><p class="article-intro">'+safe(a.desc)+'</p><div class="meta"><span>About 2 minutes to read</span><span>Practical guide</span></div></header><nav class="toc" aria-label="On this page"><b>In this guide</b>'+toc+'</nav><article class="article" itemscope itemtype="https://schema.org/TechArticle"><meta itemprop="headline" content="'+safe(a.title)+'"><meta itemprop="description" content="'+safe(a.desc)+'"><meta itemprop="inLanguage" content="en"><p>'+safe(a.desc)+'</p>'+body+'<section class="faq"><h2>Common questions</h2>'+faq+'</section></article><section class="helpbox"><b>Still need a hand?</b><p>Tell support which page you were using and what you were trying to do. Never include your password, Activity PIN or verification code.</p><button class="pill" data-contact>Contact support</button></section><h2 class="section-title">Explore other topics</h2><div class="related">'+categories.filter(c=>c[0]!==id).slice(0,3).map(c=>'<button data-article="'+c[0]+'">'+c[1]+' <span>↗</span></button>').join("")+'</div><button class="row" style="margin-top:16px" data-home>← Back to all help topics</button>';
if(schemaNode)schemaNode.remove();schemaNode=document.createElement("script");schemaNode.type="application/ld+json";schemaNode.textContent=JSON.stringify({"@context":"https://schema.org","@type":"TechArticle",headline:a.title,description:a.desc,articleSection:categories.find(c=>c[0]===id)[1],wordCount:count,inLanguage:"en",mainEntityOfPage:location.href,author:{"@type":"Organization",name:"Strap Support"},publisher:{"@type":"Organization",name:"Strap"}});document.head.appendChild(schemaNode);window.scrollTo(0,0)}
function contact(){activeTab="contact";tabs();$("#hero").hidden=true;search.hidden=true;view.innerHTML='<h2 class="section-title">Contact Strap Support</h2><p class="sub">Tell us what happened and what you expected. We will use your details only to respond to this request.</p><form class="form" id="ticket"><label for="topic">What is this about?</label><select id="topic"><option>Something is not working</option><option>Billing or my plan</option><option>Account access</option><option>Online store</option><option>Importing products</option><option>Feedback or an idea</option><option>Something else</option></select><label for="email">Your email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"><label for="store">Store name (optional)</label><input id="store" autocomplete="organization" placeholder="Your business name"><label for="message">Your message</label><textarea id="message" maxlength="4000" required minlength="10" placeholder="Describe the issue and what you expected..."></textarea><p class="hint">Do not include passwords, Activity PINs, verification codes or card details.</p><button class="pill" id="send" style="margin-top:18px">Send message</button><p id="ticket-status" class="status" role="status" aria-live="polite"></p></form>';if(window.StrapAPI){StrapAPI.call("GET","me").then(r=>{if(r.ok&&r.email&&$("#email"))$("#email").value=r.email})}}
async function sendTicket(e){e.preventDefault();const b=$("#send"),st=$("#ticket-status");b.disabled=true;b.textContent="Sending…";st.textContent="";st.className="status";try{const r=await StrapAPI.contact($("#topic").value,$("#message").value.trim(),$("#email").value.trim(),$("#store").value.trim());if(!r.ok)throw Error(r.msg||"Could not send your message.");view.innerHTML='<div class="hero" style="padding:45px 0"><div class="orb">✓</div><h1>Message <span>sent.</span></h1><p>Your request has reached Strap Support. We will reply to the email address you provided.</p></div><button class="pill alt" data-home>Back to help centre</button>'}catch(err){b.disabled=false;b.textContent="Send message";st.classList.add("error");st.textContent=err.message||"We could not send your message. Please try again."}}
async function status(){activeTab="status";tabs();$("#hero").hidden=true;search.hidden=true;view.innerHTML='<h2 class="section-title">Checking Strap services…</h2>';try{const r=await fetch("/api/health",{cache:"no-store"});const h=await r.json();const rows=[["Application database",h.db],["Neon database connection",h.db],["Authentication service",h.auth]];view.innerHTML='<h2 class="section-title">'+(rows.every(x=>x[1])?"Services are responding":"Some checks need attention")+'</h2><p class="sub">Live health checks from the Strap application.</p><div class="rows">'+rows.map(x=>'<div class="row"><i class="dot '+(x[1]?"":"warn")+'"></i><span><b>'+x[0]+'</b><small>'+(x[1]?"Health check passed":"Could not confirm this service is healthy")+'</small></span></div>').join("")+'</div>'}catch(e){view.innerHTML='<h2 class="section-title">Status unavailable</h2><p class="sub">We could not retrieve the latest health check. Please try again shortly.</p>'}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-article]");if(a){article(a.dataset.article);return}if(e.target.closest("[data-home]")){home();return}if(e.target.closest("[data-contact]")){contact();return}const t=e.target.closest("[data-tab]");if(t){if(t.dataset.tab==="help")home();else if(t.dataset.tab==="contact")contact();else status()}});
search.addEventListener("input",renderHome);$("#ticket")?.addEventListener("submit",sendTicket);
$("#back").addEventListener("click",()=>{if(new URLSearchParams(location.search).has("article"))home();else if(document.referrer)history.back();else location.href="dashboard.html"});
window.addEventListener("popstate",()=>{const id=new URLSearchParams(location.search).get("article");if(id)article(id,false);else home(false)});
const initial=new URLSearchParams(location.search).get("article");if(initial&&articles[initial])article(initial,false);else renderHome();
})();
</script>
</body></html>
