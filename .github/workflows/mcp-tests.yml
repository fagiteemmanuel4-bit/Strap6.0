name: Strap MCP tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MCP security and tool tests
        run: npm test
