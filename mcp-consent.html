<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a"><title>Approve Strap access</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f5f5f5;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,460px);background:#111;border:1px solid #292929;border-radius:22px;padding:28px;box-shadow:0 24px 80px #0008}.mark{width:48px;height:48px;border-radius:15px;background:#e6f53a;color:#090909;display:grid;place-items:center;font-weight:900;font-size:25px}.muted{color:#a2a2a2;line-height:1.55}h1{font-size:25px;margin:20px 0 8px}.client{padding:16px;background:#080808;border:1px solid #303030;border-radius:14px;margin:18px 0}.client strong{display:block;font-size:17px}.scope{padding:14px;background:#191919;border-radius:12px;margin:12px 0;color:#ddd;line-height:1.6}button{width:100%;border:0;border-radius:12px;padding:14px;font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;cursor:pointer;margin-top:12px}.allow{background:#e6f53a;color:#080808}.deny{background:#202020;color:#fff;border:1px solid #383838}.error{color:#ff8b8b;min-height:22px;margin-top:12px}
</style></head><body><main class="panel">
<div class="mark">S</div><h1>Connect your AI assistant</h1>
<p class="muted">Review this request before allowing access to your Strap account.</p>
<div class="client"><strong id="client-name">An application</strong><span class="muted" id="client-info">Requesting access to Strap</span></div>
<div class="scope"><b>Requested permissions</b><p id="scope" class="muted">Loading…</p><p id="resource" class="muted"></p></div>
<p class="muted">Only approve this if you started the connection. You can revoke AI connections from Strap settings.</p>
<button class="allow" id="allow" type="button">Allow access</button>
<button class="deny" id="deny" type="button">Deny</button>
<p class="error" id="error" role="alert"></p>
</main>
<script type="module">
import { createAuthClient } from 'https://esm.sh/@neondatabase/auth@0.8.0?bundle';
const auth=createAuthClient(location.origin+'/api/neon-auth');
const params=new URLSearchParams(location.search),error=document.getElementById('error');
const scopes=(params.get('scope')||'').split(/\s+/).filter(Boolean);
document.getElementById('scope').textContent=scopes.length?scopes.join(', '):'Sign in and identify your Strap account.';
document.getElementById('resource').textContent=params.get('resource')||'';
(async()=>{try{const {data}=await auth.getSession();if(!data?.user){location.replace('/mcp-login.html'+location.search);return;}const {data:client,error:clientError}=await auth.oauth2.publicClient({query:{client_id:params.get('client_id')||''}});if(clientError)throw clientError;document.getElementById('client-name').textContent=client?.client_name||client?.name||'An application';const uris=client?.redirect_uris||[];document.getElementById('client-info').textContent=uris.length?'Redirects to: '+uris.map(u=>{try{return new URL(u).host}catch{return 'approved app'}}).join(', '):'Requesting access to Strap';}catch(e){error.textContent=e instanceof Error?e.message:'Could not verify this request.';document.getElementById('allow').disabled=true;}})();
async function answer(accept){document.getElementById('allow').disabled=true;document.getElementById('deny').disabled=true;try{const result=await auth.oauth2.consent({accept});if(result?.error)throw result.error;}catch(e){error.textContent=e instanceof Error?e.message:'Could not complete the approval.';document.getElementById('allow').disabled=false;document.getElementById('deny').disabled=false;}}
document.getElementById('allow').addEventListener('click',()=>answer(true));
document.getElementById('deny').addEventListener('click',()=>answer(false));
</script></body></html>
