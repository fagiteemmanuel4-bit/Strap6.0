/* ===== picker.css ===== */
/* Strap – StrapPicker design: custom dropdown sheets, calendar, and the trigger fields that open them */
body.dd-lock{overflow:hidden}
.dd-layer{position:fixed;inset:0;z-index:100;font-family:"Sora","Helvetica Neue",Arial,sans-serif;color:var(--black,#0a0a0a);-webkit-tap-highlight-color:transparent}
.dd-scrim{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .3s}
.dd-layer.on .dd-scrim{opacity:1}
.dd-sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -24px 60px -20px rgba(10,10,10,.45);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);outline:0}
.dd-layer.on .dd-sheet{transform:none}
.dd-grab{flex:none;display:grid;place-items:center;height:28px}
.dd-grab i{width:44px;height:5px;border-radius:9px;background:#dcdcd6}
.dd-h{flex:none;display:flex;align-items:center;gap:12px;padding:0 20px 12px}
.dd-h h2{flex:1;font-size:21px;font-weight:600;letter-spacing:-.035em;line-height:1.2}
.dd-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#f1f1ed;color:inherit;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.dd-x:active{transform:scale(.9)}
.dd-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:2px 20px 20px;overflow-y:auto;overscroll-behavior:contain}
.dd-pick .dd-b{overflow:hidden}
.dd-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px;margin:-2px;-webkit-overflow-scrolling:touch}
.dd-empty{padding:28px 12px;text-align:center;font-size:14px;line-height:1.55;font-weight:500;color:#8d8d86}

/* search */
.dd-s{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:#f4f4f0;border:1.5px solid transparent;color:#6f6f69;transition:border-color .2s,background .2s}
.dd-s:focus-within{background:#fff;border-color:var(--black,#0a0a0a)}
.dd-s input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px "Sora",sans-serif;color:var(--black,#0a0a0a)}
.dd-s input::-webkit-search-cancel-button{display:none}

/* list rows */
.dd-list.list{display:grid;gap:8px;align-content:start}
.dd-o{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 14px 10px 12px;border:1.5px solid #ececea;border-radius:22px;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .12s,box-shadow .2s}
.dd-o:active,.dd-chip:active,.dd-card:active{transform:scale(.97)}
.dd-o:disabled{opacity:.45}
.dd-o.on{border-color:var(--black,#0a0a0a);background:#fafaf3;box-shadow:inset 0 0 0 1px var(--black,#0a0a0a)}
.dd-ot{flex:1;min-width:0}
.dd-ot b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.dd-ot small,.dd-card small,.dd-chip small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;line-height:1.35;color:#8d8d86}
.dd-tile{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#f1f1ed;color:var(--black,#0a0a0a);font-size:16px;font-weight:700;overflow:hidden;font-style:normal}
.dd-tile img{width:100%;height:100%;object-fit:cover}
.tone-n{background:#f1f1ed;color:#3a3a36}.tone-lemon{background:var(--lemon,#e6f53a);color:#0a0a0a}.tone-green{background:#dcf2e5;color:#1f7a4d}
.tone-blue{background:#e0ebff;color:#1d4ed8}.tone-pink{background:#fde4f3;color:#b21fa8}.tone-amber{background:#fdecc8;color:#a4600a}.tone-grey{background:#e9e9e4;color:#55554f}
.dd-sdot{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff)}
.dd-sdot::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 24%,transparent);border:1px solid rgba(10,10,10,.12)}
.dd-ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #d9d9d3;color:transparent;transition:.25s cubic-bezier(.2,1.5,.3,1)}
.dd-list:not(.multi) .dd-ck{border-color:transparent;opacity:0;transform:scale(.55)}
.on>.dd-ck{background:var(--black,#0a0a0a);border-color:var(--black,#0a0a0a);color:var(--lemon,#e6f53a);opacity:1;transform:none}

/* chips (units) */
.dd-list.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.dd-chip{flex:1 1 calc(50% - 10px);min-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:18px 12px;border:1.5px solid #ececea;border-radius:24px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .12s}
.dd-chip b{font-size:24px;font-weight:700;letter-spacing:-.04em}
.dd-chip small{margin:0}
.dd-chip.on{background:var(--black,#0a0a0a);border-color:var(--black,#0a0a0a);color:#fff}
.dd-chip.on b{color:var(--lemon,#e6f53a)}.dd-chip.on small{color:rgba(255,255,255,.62)}

/* cards (package, layout) */
.dd-list.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.dd-card{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 12px 14px;border:1.5px solid #ececea;border-radius:26px;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .12s}
.dd-card b{margin-top:8px;font-size:15px;font-weight:600;letter-spacing:-.02em}
.dd-art{height:96px;border-radius:18px;background:#f4f4f0;display:grid;place-items:center;overflow:hidden;transition:background .25s}
.dd-art svg{width:84%;height:84%}
.dd-card .dd-ck{position:absolute;top:18px;right:18px;width:26px;height:26px;background:#fff}
.dd-card.on{border-color:var(--black,#0a0a0a);box-shadow:inset 0 0 0 1px var(--black,#0a0a0a)}
.dd-card.on .dd-art{background:color-mix(in srgb,var(--lemon,#e6f53a) 38%,#fff)}

/* create row + done */
.dd-new{flex:none;display:flex;gap:8px}
.dd-new input{flex:1;min-width:0;height:54px;border:1.5px dashed #c9c9c2;border-radius:18px;padding:0 16px;background:#fafaf7;font:500 15.5px "Sora",sans-serif;color:var(--black,#0a0a0a);outline:0;transition:border-color .2s,background .2s}
.dd-new input:focus{border-style:solid;border-color:var(--black,#0a0a0a);background:#fff}
.dd-new.bad input{border-color:#d6342a;animation:ddShake .4s}
@keyframes ddShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dd-new button{flex:none;display:flex;align-items:center;gap:6px;height:54px;padding:0 18px;border:0;border-radius:18px;background:var(--black,#0a0a0a);color:#fff;font:600 14.5px "Sora",sans-serif;cursor:pointer;transition:transform .15s}
.dd-new button:active{transform:scale(.95)}
.dd-done{flex:none;height:56px;border:0;border-radius:999px;background:var(--black,#0a0a0a);color:var(--lemon,#e6f53a);font:600 16px "Sora",sans-serif;cursor:pointer;transition:transform .15s}
.dd-done:active{transform:scale(.97)}

/* calendar */
.dd-ch{display:flex;align-items:center;gap:8px}
.dd-nav{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid #ececea;background:#fff;color:inherit;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.dd-nav:active{transform:scale(.9)}.dd-nav:disabled{opacity:.3;pointer-events:none}
.dd-cm{flex:1;height:46px;border-radius:999px;border:0;background:#f4f4f0;color:inherit;font:600 16px "Sora",sans-serif;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.dd-cm.static{cursor:default}
.dd-wk,.dd-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dd-wk span{text-align:center;font-size:12px;font-weight:600;color:#8d8d86;padding:8px 0 4px}
.dd-d{position:relative;aspect-ratio:1;border-radius:50%;border:0;background:none;color:inherit;font:500 15.5px "Sora",sans-serif;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .12s}
.dd-d:not(:disabled):not(.on):active{transform:scale(.88);background:#f1f1ed}
.dd-d.off{pointer-events:none}
.dd-d.today::after{content:"";position:absolute;bottom:20%;width:4px;height:4px;border-radius:50%;background:currentColor}
.dd-d.on{background:var(--black,#0a0a0a);color:var(--lemon,#e6f53a);font-weight:700}
.dd-d:disabled{color:#c9c9c2;cursor:default}
.dd-yrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:46vh;max-height:46dvh;overflow-y:auto;overscroll-behavior:contain;padding:2px}
.dd-y{height:48px;border-radius:16px;border:1.5px solid #ececea;background:#fff;color:inherit;font:600 15px "Sora",sans-serif;cursor:pointer}
.dd-y.on{background:var(--black,#0a0a0a);color:var(--lemon,#e6f53a);border-color:var(--black,#0a0a0a)}
.dd-cf{display:flex}
.dd-cf button{flex:1;height:50px;border-radius:999px;border:0;background:#f1f1ed;color:inherit;font:600 14.5px "Sora",sans-serif;cursor:pointer}

/* trigger fields (replace native select / date / datalist) */
.dd-native{display:none!important}
.dd-t:not(.fi){display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:0;border:0;background:none;color:var(--black,#0a0a0a);font:500 16px "Sora",sans-serif;text-align:left;cursor:pointer;outline:0}
.dd-t.fi{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.dd-t.fi.fs{justify-content:flex-start}
.dd-tv{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.dd-tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-ts{flex:none;font-size:12px;font-weight:500;color:#8d8d86}
.dd-tv.ph{color:#8d8d86}
.dd-t.fi .dd-tv.ph{color:rgba(10,10,10,.38)}
.dd-t>svg{flex:none;color:#55554f;transition:transform .25s}
.dd-t[aria-expanded=true]>svg{transform:rotate(180deg)}
.dd-t:focus-visible{outline:2px solid var(--black,#0a0a0a);outline-offset:4px;border-radius:8px}
.dd-t.fi.fs{background-image:none}
.dd-mi{flex:none;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-style:normal}
.dd-mdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 24%,transparent);margin:0 4px 0 2px}
.dd-mart{flex:none;width:42px;height:28px;border-radius:9px;background:#f4f4f0;display:grid;place-items:center;overflow:hidden;font-style:normal}
.dd-mart svg{width:90%;height:90%}
.dd-t.compact{gap:4px}.dd-t.compact .dd-tt{overflow:visible}
.dd-t.compact>svg{width:16px;height:16px}
.pm-fl .dd-t{margin-top:2px}.pm-fl:not(:has(>span)) .dd-t{margin-top:0}
.pm-fl.sel:has(>.dd-t)>svg,.pm-so:has(>.dd-t)>svg,.pm-sel:has(>.dd-t)>svg{display:none}
.pm-fl.sm .dd-tv{gap:6px}
.pm-so .dd-t{height:100%;padding:0 10px 0 12px;font-size:13.5px;max-width:176px}
.pm-so .dd-mi{width:24px;height:24px;border-radius:8px}
.pm-sel .dd-t{width:auto;padding:10px 6px 10px 8px;font-size:14.5px}

<body class="is-dash">
<main class="dash go focus" id="dash">
  <div class="dtop"></div>
  <section class="dsheet"><div class="pane" data-id="new-sale" id="sales-root"></div></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../api.js"></script>
<script>/* Hydrate the authenticated staff workspace and enable real backend sync before the sales modules load. */
if (window.StrapAPI && typeof StrapAPI.guard === "function") StrapAPI.guard();
</script>
<script>
/* ===== connection stand-in (the real api.js talks to your server) =====
   Only here so this file runs on its own. When you connect your real api.js, delete this block.
   The email code for the activity PIN accepts 123456 in this stand-in. */
if (!window.StrapAPI) window.StrapAPI = {
  upload: async () => null,
  signOut: async () => ({ ok: true }),
  auth: {
    sendCode: async () => ({ ok: true }),
    verifyCode: async (email, code) => ({ ok: code === '123456' }),
    changePassword: async () => ({ ok: true })
  }
};

/* ===== picker.js ===== */
/* Strap – StrapPicker: one custom dropdown system for the whole app.
   - StrapPicker.pick({...})  bottom-sheet list / chips / cards, single or multi select, optional "create new" row
   - StrapPicker.date({...})  custom calendar sheet (replaces the native date popup)
   - Every native <select>, <input type="date"> and <input list> that appears in the page is upgraded automatically
     (the original element stays in the DOM, hidden, so forms, validation and saving keep working unchanged).
   - PRESETS below give each dropdown its own look (icons, status dots, size cards, layout previews, ...). */
window.StrapPicker = (() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const tap = () => { try { window.StrapKit && StrapKit.fx && StrapKit.fx('tap'); } catch (e) {} };

  /* ---------- icons ---------- */
  const PATHS = {
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M6 12h12"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>', chev: '<path d="m6 9 6 6 6-6"/>', chevL: '<path d="m15 6-6 6 6 6"/>', chevR: '<path d="m9 6 6 6-6 6"/>',
    cal: '<rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', az: '<path d="M4 17 7.5 7 11 17M5.3 13.8h4.4"/><path d="M14 8h5l-5 8h5"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    shirt: '<path d="M8.5 4 4 6.5 6 10.5l2-1V20h8V9.5l2 1 2-4L15.5 4a3.5 3.5 0 0 1-7 0z"/>', drop: '<path d="M12 3.5s5.5 6 5.5 10a5.5 5.5 0 0 1-11 0c0-4 5.5-10 5.5-10z"/>',
    phone: '<rect x="7" y="3.5" width="10" height="17" rx="2.6"/><path d="M11 17.5h2"/>', cup: '<path d="M5 8.5h11V14a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M12 3.5v2"/>',
    dumb: '<path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/>', home: '<path d="M4 11 12 4.5 20 11v8.5H4z"/><path d="M10 19.5v-5h4v5"/>',
    pencil: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="m14.5 6.5 3 3"/>', dots: '<circle cx="7" cy="7" r="1.6"/><circle cx="17" cy="7" r="1.6"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>',
    box: '<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="m3.5 8 8.5 4.5L20.5 8M12 12.5v8"/>', cloud: '<path d="M12 4.5v9M8 10l4 4 4-4"/><path d="M5 19.5h14"/>',
    user: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>', tag: '<path d="M3.5 12.2V5.5a2 2 0 0 1 2-2h6.7l8 8a2 2 0 0 1 0 2.8l-5.2 5.2a2 2 0 0 1-2.8 0z"/><circle cx="8.3" cy="8.3" r="1.4"/>',
    collections: '<rect x="3.5" y="8" width="13" height="12" rx="2.5"/><path d="M7.5 4.5h11a2 2 0 0 1 2 2V16"/>', store: '<path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12.5V20h13v-7.5"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z"/>',
    trend: '<path d="M4 19.5h16"/><path d="m5 15 4.5-4.5 3.5 3L19 7"/><path d="M14.5 7H19v4.5"/>', branch: '<circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="9" r="2.3"/><path d="M6 8.3v7.4M18 11.3c0 3.5-4 3-9.5 5"/>'
  };
  const ic = (k, s = 20, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[k] || ''}</svg>`;

  /* ---------- layers (bottom sheets) ---------- */
  let locks = 0; const stack = [];
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) { e.stopPropagation(); stack[stack.length - 1](); } }, true);
  function layer(cls, title, html) {
    const w = document.createElement('div'); w.className = 'dd-layer ' + cls;
    w.innerHTML = `<div class="dd-scrim"></div><section class="dd-sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="dd-grab"><i></i></div>
      <header class="dd-h"><h2>${esc(title)}</h2><button type="button" class="dd-x" data-x aria-label="Close">${ic('close', 20, 2.2)}</button></header><div class="dd-b">${html}</div></section>`;
    document.body.appendChild(w); locks++; document.body.classList.add('dd-lock'); void w.offsetWidth; w.classList.add('on');
    let closed = false;
    const api = {
      el: w, body: $('.dd-b', w), onClose: null,
      close() {
        if (closed) return; closed = true; w.classList.remove('on');
        const i = stack.indexOf(api.close); if (i > -1) stack.splice(i, 1);
        locks = Math.max(0, locks - 1); if (!locks) document.body.classList.remove('dd-lock');
        setTimeout(() => w.remove(), reduced() ? 0 : 360); if (api.onClose) api.onClose();
      }
    };
    stack.push(api.close);
    w.addEventListener('click', e => { if (e.target.closest('.dd-scrim') || e.target.closest('[data-x]')) api.close(); });
    return api;
  }

  /* ---------- list / chips / cards picker ---------- */
  const TONES = ['lemon', 'blue', 'green', 'pink', 'amber', 'grey'];
  const toneOf = s => TONES[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];
  const tile = o => {
    if (o.html) return `<i class="dd-tile tone-${o.tone || 'n'}">${o.html}</i>`;
    if (o.img) return `<i class="dd-tile"><img src="${esc(o.img)}" alt=""></i>`;
    if (o.sw) return `<i class="dd-sdot" style="--c:${esc(o.sw)}"></i>`;
    if (o.ic) return `<i class="dd-tile tone-${o.tone || 'n'}">${ic(o.ic, 22, 1.8)}</i>`;
    if (o.letter) return `<i class="dd-tile tone-${o.tone || toneOf(o.letter)}">${esc(o.letter)}</i>`;
    return '';
  };
  const optHtml = (o, variant, on) => {
    const ck = `<span class="dd-ck">${ic('check', 16, 3)}</span>`;
    const at = `type="button" role="option" data-v="${esc(o.v)}" aria-selected="${on}"${o.disabled ? ' disabled' : ''}`;
    const sub = o.s ? `<small>${esc(o.s)}</small>` : '';
    if (variant === 'chips') return `<button ${at} class="dd-chip${on ? ' on' : ''}"><b>${esc(o.l)}</b>${sub}</button>`;
    if (variant === 'cards') return `<button ${at} class="dd-card${on ? ' on' : ''}"><span class="dd-art">${o.art || ''}</span><b>${esc(o.l)}</b>${sub}${ck}</button>`;
    return `<button ${at} class="dd-o${on ? ' on' : ''}">${tile(o)}<span class="dd-ot"><b${o.css ? ` style="${esc(o.css)}"` : ''}>${esc(o.l)}</b>${sub}</span>${ck}</button>`;
  };

  // options: [{ v, l, s?, ic?, tone?, sw?, img?, letter?, html?, art?, css?, disabled? }]
  // resolves with the chosen value (array when multi), or undefined when dismissed
  function pick({ title = 'Choose', options = [], value, multi = false, variant = 'list', search, create, empty = 'Nothing here yet.', done = 'Done' } = {}) {
    return new Promise(resolve => {
      const opts = options.map(o => ({ ...o, _v: o.v, v: String(o.v) }));
      const sel = new Set(multi ? (value || []).map(String) : [String(value)]);
      let q = '', result;
      const showSearch = search == null ? opts.length > 8 : search;
      const L = layer('dd-pick ' + variant, title, `${showSearch ? `<label class="dd-s">${ic('search', 19, 2)}<input type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search"></label>` : ''}
        <div class="dd-list ${variant}${multi ? ' multi' : ''}" role="listbox" aria-multiselectable="${multi}"></div>
        ${create ? `<form class="dd-new" autocomplete="off"><input type="text" maxlength="40" placeholder="${esc(create.placeholder || 'Add new')}" aria-label="${esc(create.label || 'Add new')}"><button type="submit">${ic('plus', 18, 2.4)}<span>${esc(create.label || 'Add')}</span></button></form>` : ''}
        ${multi ? '<button type="button" class="dd-done" data-done></button>' : ''}`);
      L.onClose = () => resolve(result);
      const list = $('.dd-list', L.body), doneBtn = $('[data-done]', L.body);
      const draw = () => {
        const n = q.trim().toLowerCase(), rows = n ? opts.filter(o => (o.l + ' ' + (o.s || '')).toLowerCase().includes(n)) : opts;
        list.innerHTML = rows.length ? rows.map(o => optHtml(o, variant, sel.has(o.v))).join('') : `<p class="dd-empty">${esc(n ? 'No matches found.' : empty)}</p>`;
      };
      const upd = () => { if (doneBtn) doneBtn.textContent = sel.size ? `${done} · ${sel.size} selected` : done; };
      const finish = v => { result = v; L.close(); };
      draw(); upd();
      setTimeout(() => {
        const on = $('.on', list); if (on && opts.length > 6) on.scrollIntoView({ block: 'center' });
        const s = $('.dd-s input', L.body); if (s && matchMedia('(pointer:fine)').matches) s.focus(); else $('.dd-sheet', L.el).focus({ preventScroll: true });
      }, 380);
      const si = $('.dd-s input', L.body); if (si) si.addEventListener('input', () => { q = si.value; draw(); });
      L.body.addEventListener('click', e => {
        const b = e.target.closest('[data-v]');
        if (b) {
          const o = opts.find(x => x.v === b.dataset.v); if (!o || o.disabled) return; tap();
          if (multi) { sel.has(o.v) ? sel.delete(o.v) : sel.add(o.v); b.classList.toggle('on', sel.has(o.v)); b.setAttribute('aria-selected', sel.has(o.v)); upd(); }
          else finish(o._v);
          return;
        }
        if (e.target.closest('[data-done]')) finish(opts.filter(o => sel.has(o.v)).map(o => o._v));
      });
      const form = $('.dd-new', L.body);
      if (form) form.addEventListener('submit', async e => {
        e.preventDefault(); const inp = $('input', form), name = inp.value.trim(); if (!name) return;
        let o = null; try { o = await create.make(name); } catch (er) {}
        if (!o) { form.classList.add('bad'); setTimeout(() => form.classList.remove('bad'), 600); return; }
        const n = { ...o, _v: o.v, v: String(o.v) }; if (!opts.some(x => x.v === n.v)) opts.unshift(n);
        inp.value = ''; q = ''; if (si) si.value = ''; tap();
        if (multi) { sel.add(n.v); draw(); upd(); list.scrollTop = 0; } else finish(n._v);
      });
    });
  }

  /* ---------- calendar ---------- */
  function date({ title = 'Choose a date', value = '', min = '', max = '', start = '' } = {}) {
    return new Promise(resolve => {
      const pad = n => String(n).padStart(2, '0'), iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
      const parse = s => { const r = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return r ? { y: +r[1], m: +r[2] - 1, d: +r[3] } : null; };
      const now = new Date(), today = iso(now.getFullYear(), now.getMonth(), now.getDate());
      const v = parse(value), lo = parse(min), hi = parse(max);
      const base = v || (hi && today > max ? hi : lo && today < min ? lo : { y: now.getFullYear(), m: now.getMonth() });
      let y = base.y, m = base.m, mode = start === 'year' && !v ? 'year' : 'day', result;
      if (mode === 'year' && hi) y = Math.min(y, now.getFullYear() - 25);
      const yMin = lo ? lo.y : now.getFullYear() - 100, yMax = hi ? hi.y : now.getFullYear() + 10;
      const L = layer('dd-cal-l', title, '');
      L.onClose = () => resolve(result);
      const inRange = ds => !((min && ds < min) || (max && ds > max));
      const finish = ds => { result = ds; L.close(); };
      function draw() {
        if (mode === 'year') {
          let ys = ''; for (let k = yMax; k >= yMin; k--) ys += `<button type="button" class="dd-y${k === y ? ' on' : ''}" data-y="${k}">${k}</button>`;
          L.body.innerHTML = `<div class="dd-ch"><button type="button" class="dd-nav" data-back aria-label="Back to days">${ic('chevL', 20, 2.2)}</button><span class="dd-cm static">Select a year</span></div><div class="dd-yrs">${ys}</div>`;
          setTimeout(() => { const on = $('.dd-y.on', L.body); if (on) on.scrollIntoView({ block: 'center' }); }, 30); return;
        }
        const lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
        const pl = new Date(y, m, 0), nf = new Date(y, m + 1, 1);
        const prevOff = min && iso(pl.getFullYear(), pl.getMonth(), pl.getDate()) < min, nextOff = max && iso(nf.getFullYear(), nf.getMonth(), 1) > max;
        let cells = '<span class="dd-d off"></span>'.repeat(lead);
        for (let d = 1; d <= dim; d++) { const ds = iso(y, m, d); cells += `<button type="button" class="dd-d${ds === value ? ' on' : ''}${ds === today ? ' today' : ''}" data-d="${ds}"${inRange(ds) ? '' : ' disabled'} aria-label="${d} ${new Date(y, m, 1).toLocaleDateString('en', { month: 'long' })} ${y}">${d}</button>`; }
        L.body.innerHTML = `<div class="dd-ch"><button type="button" class="dd-nav" data-prev aria-label="Previous month"${prevOff ? ' disabled' : ''}>${ic('chevL', 20, 2.2)}</button>
          <button type="button" class="dd-cm" data-mode>${new Date(y, m, 1).toLocaleDateString('en', { month: 'long' })} ${y}${ic('chev', 16, 2.4)}</button>
          <button type="button" class="dd-nav" data-next aria-label="Next month"${nextOff ? ' disabled' : ''}>${ic('chevR', 20, 2.2)}</button></div>
          <div class="dd-wk">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<span>${x}</span>`).join('')}</div><div class="dd-days">${cells}</div>
          ${inRange(today) ? '<div class="dd-cf"><button type="button" data-today>Today</button></div>' : ''}`;
      }
      draw();
      L.body.addEventListener('click', e => {
        const t = e.target;
        const d = t.closest('[data-d]'); if (d && !d.disabled) { tap(); return finish(d.dataset.d); }
        if (t.closest('[data-prev]')) { m--; if (m < 0) { m = 11; y--; } return draw(); }
        if (t.closest('[data-next]')) { m++; if (m > 11) { m = 0; y++; } return draw(); }
        if (t.closest('[data-mode]')) { mode = 'year'; return draw(); }
        if (t.closest('[data-back]')) { mode = 'day'; return draw(); }
        const yr = t.closest('[data-y]'); if (yr) { y = +yr.dataset.y; mode = 'day'; tap(); return draw(); }
        if (t.closest('[data-today]')) { tap(); finish(today); }
      });
    });
  }

  /* ---------- per-dropdown designs ---------- */
  const A = s => `<svg viewBox="0 0 120 80" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s}</svg>`;
  const Y = '#e6f53a';
  const ART = {
    box: A(`<path d="M60 12 94 28v32L60 76 26 60V28z" fill="#fff"/><path d="m26 28 34 16 34-16M60 44v32"/><path d="M60 44v32l34-16V28z" fill="${Y}" stroke="none" opacity=".9"/><path d="m26 28 34 16 34-16M60 44v32M94 28v32L60 76 26 60V28L60 12z"/>`),
    mailer: A(`<rect x="18" y="20" width="84" height="50" rx="9" fill="#fff"/><path d="m21 24 39 27 39-27"/><rect x="74" y="50" width="20" height="12" rx="3" fill="${Y}"/>`),
    big: A(`<path d="M60 8 100 26v36L60 78 20 62V26z" fill="#fff"/><path d="m20 26 40 18 40-18M60 44v34"/><rect x="52" y="52" width="16" height="9" rx="2" fill="${Y}" transform="rotate(-22 60 56)"/>`),
    lDefault: A(`<rect x="10" y="10" width="46" height="60" rx="9" fill="#fff"/><path d="m17 57 12-12 9 8 7-6 6 7"/><path d="M66 18h40M66 28h28M66 38h34"/><rect x="66" y="52" width="36" height="14" rx="7" fill="${Y}"/>`),
    lGallery: A(`<rect x="12" y="8" width="96" height="42" rx="9" fill="#fff"/><path d="m22 43 18-16 14 12 10-8 24 12"/><rect x="12" y="56" width="22" height="16" rx="5" fill="${Y}"/><rect x="40" y="56" width="22" height="16" rx="5" fill="#fff"/><rect x="68" y="56" width="22" height="16" rx="5" fill="#fff"/><rect x="96" y="56" width="12" height="16" rx="5" fill="#fff"/>`),
    lMinimal: A(`<rect x="42" y="8" width="36" height="30" rx="8" fill="#fff"/><path d="M30 50h60M40 60h40"/><rect x="46" y="66" width="28" height="9" rx="4.5" fill="${Y}"/>`)
  };
  const CAT = { 'Apparel & accessories': ['shirt', 'pink'], 'Beauty & personal care': ['drop', 'blue'], 'Electronics': ['phone', 'blue'], 'Food & drinks': ['cup', 'amber'], 'Fitness & sports': ['dumb', 'green'], 'Home & living': ['home', 'lemon'], 'Stationery & office': ['pencil', 'grey'], 'Other': ['dots', 'n'] };
  const TYPES = { Physical: { ic: 'box', tone: 'lemon', s: 'Items you ship or hand over' }, Digital: { ic: 'cloud', tone: 'blue', s: 'Downloads and licences' }, Service: { ic: 'user', tone: 'green', s: 'Bookings and time' } };
  const MODE = { 'Shop or supermarket': 'store', 'Food service': 'cup', 'Fashion or electronics': 'shirt', 'Online store only': 'globe', 'Growing brand': 'trend', 'Other': 'dots' };
  const sm = t => `<span style="font-size:12px;font-weight:700;letter-spacing:-.02em">${esc(t)}</span>`;
  const PRESETS = {
    'pm-sort': { title: 'Sort products', trig: 'icon', meta: v => ({ new: { ic: 'clock', tone: 'lemon', s: 'Latest products first' }, az: { ic: 'az', tone: 'blue', s: 'Alphabetical order' }, lo: { ic: 'up', tone: 'green', s: 'Cheapest first' }, hi: { ic: 'down', tone: 'pink', s: 'Most expensive first' } }[v] || {}) },
    textstyle: { title: 'Text style', meta: v => ({
      p: { html: '<span style="font-size:17px;font-weight:600">Aa</span>', s: 'Normal body text', css: 'font-weight:500' },
      h2: { html: '<span style="font-size:22px;font-weight:700;letter-spacing:-.04em">Aa</span>', s: 'Large section title', css: 'font-size:21px;font-weight:700;letter-spacing:-.03em' },
      h3: { html: '<span style="font-size:18px;font-weight:700;letter-spacing:-.03em">Aa</span>', s: 'Smaller title', css: 'font-size:18px;font-weight:600;letter-spacing:-.02em' } }[v] || {}) },
    category: { title: 'Product category', clear: 'No category', search: true, trig: 'icon', meta: v => CAT[v] ? { ic: CAT[v][0], tone: CAT[v][1] } : {} },
    package: { title: 'Package', variant: 'cards', trig: 'art', meta: (v, l) => /^Store default/.test(l) ? { l: 'Store default', ts: '22 × 13.7 × 4.2 cm', s: 'Sample box · 22 × 13.7 × 4.2 cm', art: ART.box }
      : /mailer/i.test(l) ? { s: 'Padded envelope, light items', art: ART.mailer } : /large/i.test(l) ? { s: 'Bulky items or bundles', art: ART.big } : {} },

/* ===== store.js ===== */
/* Strap – shared store for sales, held sales, credit book, activity PIN, receipt template and preferences.
   Everything is kept in localStorage for now. Swap the `api` hooks (and the save() call) for real backend calls later. */
window.StrapStore = (() => {
  const KEY = 'strap.v1';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const blank = () => ({
    sales: [], payments: [], held: [], collections: [], credits: [], seq: 0, closed: null, pin: null, lock: { n: 0, until: 0 }, receipt: null, online: null, orders: [], oseq: 1000,
    prefs: { sound: true, vibrate: true, creditReminders: true, orderAlerts: true, lowStock: true }
  });
  let S = blank();
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    S = Object.assign(blank(), raw); S.prefs = Object.assign(blank().prefs, raw.prefs || {});
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ===== Backend hooks – replace with real calls ===== */
  const A = window.StrapAPI.auth;
  const api = {
    DEMO: false,
    sendCode: A.sendCode, verifyCode: A.verifyCode, changePassword: A.changePassword,
    async savePin(pinHash) { return { ok: true }; }, // PIN hash is saved with the rest of your data in Neon
    async scheduleCreditReminder(credit) { return { ok: true }; }
  };

  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const lineCount = s => s.lines.reduce((a, l) => a + l.qty, 0);

  // ---- hashing for the 4-digit PIN (the real check should live on your server) ----
  async function hashPin(pin, salt) {
    const data = new TextEncoder().encode(salt + ':' + pin);
    try { const buf = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(buf)].map(b => pad(b.toString(16))).join(''); }
    catch (e) { let h = 5381; for (const c of salt + ':' + pin) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
  }

  // product collections – created on the Collections page, chosen when adding a product
  const collections = {
    all: () => S.collections,
    find: name => S.collections.find(c => c.name.toLowerCase() === String(name).trim().toLowerCase()),
    add(name, description = '') {
      const n = String(name).trim().slice(0, 40); if (!n) return null;
      const ex = collections.find(n); if (ex) return ex;
      const c = { id: uid('col'), name: n, description: String(description).trim().slice(0, 80), createdAt: Date.now() };
      S.collections.unshift(c); save(); return c;
    },
    remove(id) { S.collections = S.collections.filter(c => c.id !== id); save(); }
  };

  const credits = {
    balance: c => Math.max(0, Math.round((c.total - c.payments.reduce((a, p) => a + p.amount, 0)) * 100) / 100),
    paid: c => c.payments.reduce((a, p) => a + p.amount, 0),
    open: () => S.credits.filter(c => credits.balance(c) > 0).sort((a, b) => a.due.localeCompare(b.due)),
    settled: () => S.credits.filter(c => credits.balance(c) <= 0).sort((a, b) => b.createdAt - a.createdAt),
    owed: () => S.credits.reduce((a, c) => a + credits.balance(c), 0),
    // days until due: negative = overdue
    daysLeft: c => Math.round((new Date(c.due + 'T00:00:00') - new Date(dayKey() + 'T00:00:00')) / 864e5),
    due: (within = 0) => credits.open().filter(c => credits.daysLeft(c) <= within)
  };

  return {
    api, dayKey, credits, collections, lineCount, prefs: S.prefs,
    get state() { return S; },
    save,
    nextNo() { S.seq++; save(); return 'S-' + pad(S.seq, 4); },

    // ----- sales & money -----
    addSale(sale) { S.sales.unshift(sale); save(); return sale; },
    addPayment(p) { S.payments.push({ id: uid('pay'), ts: Date.now(), ...p }); save(); },
    sales(days = 0) {
      if (!days) return S.sales;
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
      return S.sales.filter(s => s.ts >= from.getTime());
    },
    earned(days = 1) {
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
      return S.payments.filter(p => !days || p.ts >= from.getTime()).reduce((a, p) => a + p.amount, 0);
    },
    earnedAll() { return S.payments.reduce((a, p) => a + p.amount, 0); },
    dayStats() {
      const sales = S.sales.filter(s => dayKey(s.ts) === dayKey());
      const creditToday = sales.filter(s => s.method === 'credit');
      return {
        sales, count: sales.length, items: sales.reduce((a, s) => a + lineCount(s), 0),
        earned: S.payments.filter(p => dayKey(p.ts) === dayKey()).reduce((a, p) => a + p.amount, 0),
        creditGiven: creditToday.reduce((a, s) => a + s.total, 0), owedTotal: credits.owed()
      };
    },

    // ----- held sales -----
    addHeld(h) { S.held.unshift({ id: uid('h'), ts: Date.now(), ...h }); save(); },
    removeHeld(id) { S.held = S.held.filter(h => h.id !== id); save(); },

    // ----- credit book -----
    addCredit(c) { S.credits.unshift({ id: uid('c'), createdAt: Date.now(), payments: [], ...c }); save(); api.scheduleCreditReminder(S.credits[0]); return S.credits[0]; },
    payCredit(id, amount) {
      const c = S.credits.find(x => x.id === id); if (!c) return null;
      const amt = Math.min(Math.max(0, +amount || 0), credits.balance(c)); if (!amt) return c;
      c.payments.push({ ts: Date.now(), amount: amt });
      S.payments.push({ id: uid('pay'), ts: Date.now(), amount: amt, saleId: c.saleId, method: 'credit', type: 'credit' });
      save(); return c;
    },

    // ----- closing the day -----
    isClosed() { return !!(S.closed && S.closed.day === dayKey()); },
    closeDay(info) { S.closed = { day: dayKey(), ts: Date.now(), ...info }; save(); },
    reopenDay() { S.closed = null; save(); },

    // ----- activity PIN -----
    hasPin() { return !!(S.pin && S.pin.hash); },
    async setPin(pin) {
      const salt = uid('s'), hash = await hashPin(pin, salt);
      const r = await api.savePin(hash); if (!r.ok) return r;
      S.pin = { salt, hash }; S.lock = { n: 0, until: 0 }; save(); return { ok: true };
    },
    async checkPin(pin) { return !!S.pin && (await hashPin(pin, S.pin.salt)) === S.pin.hash; },
    lockLeft() { return Math.max(0, Math.ceil((S.lock.until - Date.now()) / 1000)); },
    pinFail() { S.lock.n++; if (S.lock.n >= 5) { S.lock = { n: 0, until: Date.now() + 30000 }; } save(); return S.lock.n; },
    pinOk() { S.lock = { n: 0, until: 0 }; save(); },

    // ----- receipt template (JSON) & prefs -----
    getReceiptRaw() { return S.receipt; },
    setReceiptRaw(t) { S.receipt = t; save(); }
  };
})();


/* ===== kit.js ===== */
/* Strap – shared UI kit: bottom sheets, custom dropdown picker (no native <select>), confirm dialog,
   colour field, beep + vibration. Used by the sales page, security flow and settings. */
window.StrapKit = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const U = StrapUI, ic = U.ic, esc = U.esc;
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- sound + vibration (respect the user's settings) ---------- */
  let ac = null;
  const prefs = () => StrapStore.prefs;
  function tone(freq, start, dur, type = 'square', vol = 0.07) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + start;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const beep = kind => {
    if (!prefs().sound) return;
    if (kind === 'add') tone(1480, 0, 0.09);
    else if (kind === 'ok') { tone(988, 0, 0.12, 'triangle', .1); tone(1318, 0.13, 0.12, 'triangle', .1); tone(1760, 0.27, 0.22, 'triangle', .1); }
    else if (kind === 'err') { tone(220, 0, 0.18, 'sawtooth', .06); tone(165, 0.2, 0.22, 'sawtooth', .06); }
    else if (kind === 'tap') tone(900, 0, 0.04, 'sine', .05);
  };
  // "little sprinkle" = a quick run of small pulses
  const buzz = kind => {
    if (!prefs().vibrate || !navigator.vibrate) return;
    try {
      navigator.vibrate(kind === 'ok' ? [22, 40, 22, 40, 22, 40, 22, 60, 90] : kind === 'err' ? [70, 50, 70] : kind === 'tap' ? 8 : 16);
    } catch (e) {}
  };
  const fx = kind => { beep(kind); buzz(kind); };

  /* ---------- scroll lock shared by every layer ---------- */
  let locks = 0;
  const lock = on => { locks = Math.max(0, locks + (on ? 1 : -1)); document.body.classList.toggle('pm-open', locks > 0); };

  /* ---------- bottom sheet ---------- */
  function sheet({ title = '', body = '', cls = '', onClose } = {}) {
    const wrap = el('div', 'pm-layer kt-layer');
    wrap.innerHTML = `<div class="pm-scrim"></div><section class="pm-sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="pm-grab"><i></i></div>
      <div class="pm-sh"><h2>${title}</h2><button type="button" class="pm-x" data-kc aria-label="Close">${ic('close', 20, 2.2)}</button></div><div class="kt-body">${body}</div></section>`;
    document.body.appendChild(wrap); lock(true); void wrap.offsetWidth; wrap.classList.add('on');
    let closed = false;
    const api = {
      el: wrap, body: $('.kt-body', wrap), panel: $('.pm-sheet', wrap),
      setTitle: t => { $('.pm-sh h2', wrap).innerHTML = t; },
      close() {
        if (closed) return; closed = true; wrap.classList.remove('on'); lock(false);
        setTimeout(() => wrap.remove(), reduced() ? 0 : 380); if (onClose) onClose();
      }
    };
    wrap.addEventListener('click', e => { if (e.target.closest('.pm-scrim') || e.target.closest('[data-kc]')) api.close(); });
    return api;
  }

  /* ---------- custom dropdown: a field that opens a bottom list ---------- */
  // options: [{ v, l, s?, sw?, font? }]; resolves with the chosen value (or undefined when dismissed)
  const pick = ({ title, options, value }) => StrapPicker.pick({ title, value, options: options.map(o => ({ ...o, css: o.font ? 'font-family:' + o.font : '' })) });
  // field markup for a custom dropdown (the caller listens for clicks on [data-dd])
  const dd = (key, label, valueLabel, extra = '') => `<button type="button" class="kt-dd" data-dd="${esc(key)}" aria-haspopup="listbox"><span class="kt-ddl">${esc(label)}</span><b ${extra}>${esc(valueLabel)}</b>${ic('chevUD', 18, 2.2)}</button>`;

  /* ---------- centred confirm dialog ---------- */
  function confirm({ title, body = '', ok = 'Yes', cancel = 'Not now', icon = 'info', danger = false }) {
    return new Promise(res => {
      const w = el('div', 'kt-modal');
      w.innerHTML = `<div class="kt-mscrim"></div><div class="kt-card" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <span class="kt-mic${danger ? ' bad' : ''}">${ic(icon, 28, 1.9)}</span><h2>${title}</h2><p>${body}</p>
        <div class="kt-mact"><button type="button" class="kt-b alt" data-n>${esc(cancel)}</button><button type="button" class="kt-b${danger ? ' danger' : ''}" data-y>${esc(ok)}</button></div></div>`;
      document.body.appendChild(w); lock(true); void w.offsetWidth; w.classList.add('on');
      const done = v => { w.classList.remove('on'); lock(false); setTimeout(() => w.remove(), reduced() ? 0 : 260); res(v); };
      w.addEventListener('click', e => { if (e.target.closest('[data-y]')) done(true); else if (e.target.closest('[data-n]') || e.target.closest('.kt-mscrim')) done(false); });
      setTimeout(() => $('[data-y]', w).focus(), 60);
    });
  }

  /* ---------- colour field: swatches + hex + native picker ---------- */
  const SWATCHES = ['#0a0a0a', '#ffffff', '#e6f53a', '#1f7a4d', '#1d4ed8', '#c026d3', '#d6342a', '#f59e0b', '#6b6b66'];
  const HEX = /^#[0-9a-f]{6}$/i;
  const colorField = (path, label, value) => `<div class="kt-col" data-cpath="${esc(path)}"><span class="kt-cl">${esc(label)}</span>
    <div class="kt-sws">${SWATCHES.map(c => `<button type="button" class="kt-sw${c.toLowerCase() === String(value).toLowerCase() ? ' on' : ''}" style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join('')}
      <label class="kt-sw kt-sw-c" aria-label="Custom colour"><input type="color" value="${HEX.test(value) ? value : '#000000'}">${ic('plus', 16, 2.4)}</label></div>
    <label class="kt-hex"><i style="background:${HEX.test(value) ? value : '#000'}"></i><input type="text" value="${esc(value)}" maxlength="7" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${esc(label)} hex"></label></div>`;

  const switchHtml = (key, on, label) => `<button type="button" class="pm-sw${on ? ' on' : ''}" role="switch" data-sw="${esc(key)}" aria-checked="${!!on}" aria-label="${esc(label)}"><i></i></button>`;
  const money = (n, cur) => { try { return new Intl.NumberFormat('en', { style: 'currency', currency: cur || 'NGN', maximumFractionDigits: 2, minimumFractionDigits: 0, currencyDisplay: 'narrowSymbol' }).format(n); } catch (e) { return Math.round(n).toLocaleString('en'); } };

  return { $, $$, el, sleep, reduced, sheet, pick, date: StrapPicker.date, dd, confirm, colorField, switchHtml, fx, beep, buzz, lock, money, HEX };
})();

          <div class="sx-owe"><span>Balance owed</span><b id="sx-owe">${money(creditBalance())}</b></div><p class="sx-err" id="sx-err" role="alert"></p></div>` : ''}
        <div class="sx-acts"><button type="button" class="sx-hold" data-hold>${ic('pause', 20, 2.2)} Hold sale</button><button type="button" class="pm-add sx-done" data-done>${credit ? 'Record credit sale' : 'Complete sale'}<em>${money(total)}</em></button></div>`;
    }
    function onCart(e) {
      const li = e.target.closest('.sx-line'), id = li && li.dataset.id;
      const qb = e.target.closest('[data-q]'); if (qb && id) { fx('tap'); return setQty(id, lineOf(id).qty + +qb.dataset.q); }
      if (e.target.closest('[data-rm]') && id) { setQty(id, 0); return; }
      const m = e.target.closest('[data-m]'); if (m) { draft.method = m.dataset.m; fx('tap'); return drawCart(); }
      const dq = e.target.closest('[data-due]'); if (dq) { draft.due = plus(+dq.dataset.due); return drawCart(); }
      if (e.target.closest('[data-hold]')) return holdSale();
      if (e.target.closest('[data-done]')) return complete();
    }
    function onCartInput(e) {
      const f = e.target.dataset.f; if (!f) return; draft[f] = e.target.value;
      if (f === 'paid') { const o = $('#sx-owe', cartSheet.body); if (o) o.textContent = money(creditBalance()); }
      if (f === 'due') $$('.sx-qc', cartSheet.body).forEach(b => b.classList.toggle('on', draft.due === plus(+b.dataset.due)));
      const er = $('#sx-err', cartSheet.body); if (er) er.textContent = '';
    }

    function holdSale() {
      if (!cart.length) return;
      S.addHeld({ lines: cart.map(l => ({ ...l })), total: cartTotal(), label: 'Held at ' + tm(Date.now()) });
      cart = []; fx('tap'); if (cartSheet) cartSheet.close(); redrawAll(); ctx.toast('Sale held. Resume it from Held');
    }
    function redrawAll() { drawList(); drawBar(); drawCounts(); updateScn(); }

    async function complete() {
      if (!cart.length || !shift.open) return; // CASHIER: can't finish a sale while sales is closed
      const total = cartTotal(), credit = draft.method === 'credit', er = $('#sx-err', cartSheet.body);
      let deposit = 0;
      if (credit) {
        const bad = m => { fx('err'); if (er) er.textContent = m; };
        if (!draft.name.trim()) return bad('Enter the customer’s name.');
        if (draft.phone.replace(/\D/g, '').length < 7) return bad('Enter a phone number so you can contact them.');
        if (draft.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(draft.email.trim())) return bad('That email doesn’t look right.');
        if (!draft.due) return bad('Choose when the customer will pay.');
        if (draft.due < S.dayKey()) return bad('The due date can’t be in the past.');
        deposit = Math.max(0, +draft.paid || 0);
        if (deposit >= total) return bad('If they’ve paid in full, choose Cash, Card or Transfer instead.');
      }
      const btn = $('[data-done]', cartSheet.body); btn.disabled = true;
      const sale = {
        id: 'sale' + Date.now(), no: S.nextNo(), ts: Date.now(), lines: cart.map(l => ({ ...l })), total, method: draft.method,
        cashier: ctx.store.name || '', customer: credit ? { name: draft.name.trim(), phone: draft.phone.trim(), email: draft.email.trim() } : null,
        paidNow: credit ? deposit : total, due: credit ? draft.due : ''
      };
      // stock comes off as soon as the sale is recorded
      sale.lines.forEach(l => { const p = prod(l.id); if (p && p.tracked) P().setQty(p.id, p.qty - l.qty); });
      S.addSale(sale);
      // [HOOK 5: WhatsApp] for a credit sale, this is where to message the customer (sale.customer.phone) with the balance and due date.
      if (credit) { const c = S.addCredit({ saleId: sale.id, no: sale.no, customer: sale.customer, total, due: draft.due }); if (deposit > 0) S.payCredit(c.id, deposit); }
      else S.addPayment({ amount: total, saleId: sale.id, method: draft.method, type: 'sale' });
      cart = []; draft = { method: 'cash', name: '', phone: '', email: '', due: '', paid: '' };
      cartSheet.close(); redrawAll(); fx('ok'); showDone(sale);
    }

    function showDone(sale) {

        ${credit ? `<p class="sx-pill">${ic('clock', 16, 2)} ${esc(sale.customer.name)} owes ${money(sale.total - sale.paidNow)}. Reminder set for ${dmy(new Date(sale.due + 'T00:00:00'))}</p>` : ''}
        <div class="sx-acts col"><button type="button" class="pm-add wide" data-rc>${ic('receipt', 20, 2)} View receipt</button><button type="button" class="pm-imp wide" data-nx>Next sale</button></div></div>` });

    /* =============== held sales =============== */

        const H = S.state.held;
        sh.body.innerHTML = H.length ? `<ul class="sx-hl">${H.map(h => `<li class="sx-hrow" data-id="${esc(h.id)}"><span class="pg-ico">${ic('pause', 22, 2)}</span><div><b>${esc(h.label || 'Held sale')}</b><small>${plural(h.lines.reduce((a, l) => a + l.qty, 0), 'item')} · ${money(h.total)}</small></div><button type="button" class="pm-add sm" data-res>Resume</button><button type="button" class="pg-x" data-del aria-label="Delete">${ic('trash', 19, 1.8)}</button></li>`).join('')}</ul>`

          if (cart.length) S.addHeld({ lines: cart.map(l => ({ ...l })), total: cartTotal(), label: 'Held at ' + tm(Date.now()) });
          cart = []; let dropped = 0;
          h.lines.forEach(l => { const p = prod(l.id); if (!p) { dropped++; return; } const n = Math.min(l.qty, maxOf(p)); if (n < l.qty) dropped++; if (n > 0) add(p, n, true); });
          S.removeHeld(h.id); sh.close(); redrawAll(); fx('tap');

    /* =============== credit book =============== */
    function openCredit() {
      let tab = 'open';
      const sh = sheet({ title: 'Credit book', cls: 'sx-csheet', onClose: drawCounts });
      const stat = (v, l, cls = '') => `<div class="${cls}"><b>${v}</b><small>${l}</small></div>`;
      const dueBadge = c => { const d = S.credits.daysLeft(c); return d < 0 ? `<span class="sx-due-b bad">${Math.abs(d)}d overdue</span>` : d === 0 ? '<span class="sx-due-b warn">Due today</span>' : d === 1 ? '<span class="sx-due-b warn">Due tomorrow</span>' : `<span class="sx-due-b">Due ${dmy(new Date(c.due + 'T00:00:00'))}</span>`; };
      const draw = () => {
        const open = S.credits.open(), done = S.credits.settled(), list = tab === 'open' ? open : done;
        const collected = S.state.credits.reduce((a, c) => a + S.credits.paid(c), 0), overdue = open.filter(c => S.credits.daysLeft(c) < 0).length;
        sh.body.innerHTML = `<div class="sx-cst">${stat(money(S.credits.owed()), 'Owed to you', 'big')}${stat(money(collected), 'Collected')}${stat(overdue, 'Overdue', overdue ? 'bad' : '')}</div>
          <div class="pm-tabs sx-ctabs"><button type="button" class="pm-tab${tab === 'open' ? ' on' : ''}" data-t="open">Open (${open.length})</button><button type="button" class="pm-tab${tab === 'done' ? ' on' : ''}" data-t="done">Settled (${done.length})</button></div>
          ${list.length ? `<ul class="sx-cl">${list.map(c => `<li class="sx-cr" data-id="${esc(c.id)}"><div class="sx-ct"><span class="sx-av">${esc(initials(c.customer.name))}</span><div><b>${esc(c.customer.name)}</b><small>${esc(c.no)} · ${money(c.total)} total${S.credits.paid(c) ? ` · ${money(S.credits.paid(c))} paid` : ''}</small></div><div class="sx-cb"><b>${tab === 'open' ? money(S.credits.balance(c)) : 'Paid'}</b>${tab === 'open' ? dueBadge(c) : ''}</div></div>
            ${tab === 'open' ? `<div class="sx-ca"><button type="button" data-a="call" aria-label="Call">${ic('phone', 20, 1.9)}<span>Call</span></button><button type="button" data-a="wa" aria-label="WhatsApp">${ic('chat', 20, 1.9)}<span>WhatsApp</span></button><button type="button" data-a="sms" aria-label="Text message">${ic('chat', 20, 1.9)}<span>SMS</span></button>${c.customer.email ? `<button type="button" data-a="mail" aria-label="Email">${ic('mail', 20, 1.9)}<span>Email</span></button>` : ''}<button type="button" class="pay" data-a="pay">${ic('cash', 20, 1.9)}<span>Got paid</span></button></div>` : ''}</li>`).join('')}</ul>`
          : `<div class="pg-empty">${U.illus('customers')}<h2>${tab === 'open' ? 'No one owes you' : 'Nothing settled yet'}</h2><p>${tab === 'open' ? 'Sales you record on credit show up here with a due date and a one-tap way to contact the customer.' : 'Credit sales that are fully paid land here.'}</p></div>`}`;
      };
      draw();
      const msg = c => `Hello ${c.customer.name.split(' ')[0]}, this is a friendly reminder from ${ctx.store.bizname || 'us'}: ${money(S.credits.balance(c))} is outstanding for purchase ${c.no}, due ${dmy(new Date(c.due + 'T00:00:00'))}. Thank you!`;
      const dial = p => { let d = p.replace(/\D/g, ''); if (d.startsWith('0') && (ctx.cur || 'NGN') === 'NGN') d = '234' + d.slice(1); return d; };
      sh.body.addEventListener('click', e => {
        const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; return draw(); }
        const a = e.target.closest('[data-a]'); if (!a) return;
        const c = S.state.credits.find(x => x.id === a.closest('.sx-cr').dataset.id); if (!c) return;
        const k = a.dataset.a, ph = c.customer.phone;

        else if (k === 'wa') window.open('https://wa.me/' + dial(ph) + '?text=' + encodeURIComponent(msg(c)), '_blank', 'noopener');
        else if (k === 'sms') location.href = 'sms:' + ph + '?body=' + encodeURIComponent(msg(c));
        else if (k === 'mail') location.href = 'mailto:' + c.customer.email + '?subject=' + encodeURIComponent('Payment reminder ' + c.no) + '&body=' + encodeURIComponent(msg(c));
        else if (k === 'pay') payCredit(c, draw);
      });
    }
    function payCredit(c, after) {
      const bal = S.credits.balance(c);
      const sh = sheet({ title: 'Record payment', cls: 'sx-paysheet', body: `<p class="sx-sub"><b>${esc(c.customer.name)}</b> owes <b>${money(bal)}</b> on ${esc(c.no)}.</p>
        <label class="pm-fl money"><span class="cur">${esc(ctx.cur)}</span><input id="sx-amt" type="number" inputmode="decimal" min="0" max="${bal}" value="${bal}" aria-label="Amount received"></label>
        <div class="sx-chips"><button type="button" class="sx-qc" data-f="1">Full balance</button><button type="button" class="sx-qc" data-f=".5">Half</button></div>
        <p class="sx-err" id="sx-perr" role="alert"></p><button type="button" class="pm-add wide" data-ok>Save payment</button>` });
      const inp = $('#sx-amt', sh.body); setTimeout(() => inp.select(), 350);
      sh.body.addEventListener('click', e => {
        const f = e.target.closest('[data-f]'); if (f) { inp.value = Math.round(bal * +f.dataset.f * 100) / 100; return; }
        if (!e.target.closest('[data-ok]')) return;

    /* =============== scan-to-sell =============== */
    function openScanner() {
      if (scn) return;
      const L = el('div', 'sx-scn');
      L.innerHTML = `<video playsinline muted autoplay></video><div class="sx-scn-shade"></div>
        <div class="sx-scn-top"><button type="button" class="sx-scn-x" data-sx aria-label="Close scanner">${ic('close', 22, 2.2)}</button><span class="sx-scn-t">Scan to sell</span><span class="sx-scn-n"><b>0</b> added</span></div>
        <div class="sx-scn-frame"><i></i><i></i><i></i><i></i><span class="sx-scn-line"></span></div>
        <p class="sx-scn-msg" role="status">Point the camera at a product’s QR code or barcode</p>
        <div class="sx-scn-bot"><form class="sx-scn-man"><input placeholder="Or type or paste a code" autocomplete="off" aria-label="Product code"><button type="submit">Add</button></form>
          <button type="button" class="sx-scn-cart" data-sc hidden></button></div>`;
      document.body.appendChild(L); StrapKit.lock(true); void L.offsetWidth; L.classList.add('on');
      const video = $('video', L), msg = $('.sx-scn-msg', L), cnt = $('.sx-scn-n b', L);
      let stream = null, det = null, tmr = null, busy = false, last = '', lastT = 0, added = 0, mt = null;
      scn = { L, cnt, update() { const n = cartCount(), b = $('[data-sc]', L); b.hidden = !n; if (n) b.innerHTML = `<span><b>${plural(n, 'item')}</b><small>${money(cartTotal())}</small></span><i>${ic('arrowR', 20, 2.4)}</i>`; } };
      const say = (t, cls) => { msg.textContent = t; msg.className = 'sx-scn-msg' + (cls ? ' ' + cls : ''); clearTimeout(mt); if (cls) mt = setTimeout(() => { msg.className = 'sx-scn-msg'; msg.textContent = 'Keep scanning, or tap Review to finish'; }, 1800); };
      function handle(code) {
        const now = Date.now(); if (code === last && now - lastT < 1800) return; last = code; lastT = now;
        const p = findByCode(code);
        if (!p) { fx('err'); return say(`No product matches “${String(code).slice(0, 24)}”`, 'bad'); }
        if (add(p)) { added++; cnt.textContent = added; L.classList.remove('flash'); void L.offsetWidth; L.classList.add('flash'); say(`Added ${p.title}`, 'ok'); }
        else say(p.qty > 0 ? `Only ${p.qty} of ${p.title} in stock` : `${p.title} is out of stock`, 'bad');
      }
      async function scan() { if (busy || video.readyState < 2) return; busy = true; try { const r = await det.detect(video); if (r.length) handle(r[0].rawValue); } catch (e) {} busy = false; }
      (async () => {
        try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); video.srcObject = stream; await video.play(); }
        catch (e) { return say('Camera isn’t available. Allow camera access, or type the code below.', 'bad'); }
        if (!('BarcodeDetector' in window)) return say('Live scanning isn’t supported in this browser yet. Type or paste the code below.', 'bad');
        let fm; try { fm = await BarcodeDetector.getSupportedFormats(); } catch (e) {}
        det = new BarcodeDetector(fm && fm.length ? { formats: fm } : undefined); tmr = setInterval(scan, 200);
      })();
      const close = () => { clearInterval(tmr); clearTimeout(mt); if (stream) stream.getTracks().forEach(t => t.stop()); L.classList.remove('on'); StrapKit.lock(false); setTimeout(() => L.remove(), reduced() ? 0 : 300); scn = null; };
      L.addEventListener('click', e => { if (e.target.closest('[data-sx]')) close(); if (e.target.closest('[data-sc]')) { close(); setTimeout(openCart, 320); } });
      $('form', L).addEventListener('submit', e => { e.preventDefault(); const i = $('input', e.target); if (i.value.trim()) handle(i.value.trim()); i.value = ''; last = ''; });
      scn.update();
    }
    function updateScn() { if (scn) scn.update(); }

    /* =============== close sales for the day =============== */
    async function askPin(title, sub) {
      for (;;) {
        const r = await Sec.pinPad({ title, sub });
        if (r === 'forgot') { const done = await Sec.setupFlow({ email: ctx.store.email, mode: 'reset' }); if (!done) return false; continue; }
        return r === true;
      }
    }
    async function closeFlow() {
      const st = S.dayStats();
      const ok = await confirm({
        title: 'Close sales for today?', icon: 'receipt', ok: 'Yes, close sales', cancel: 'Keep selling',
        body: `So far today you’ve earned <b>${money(st.earned)}</b> from ${plural(st.count, 'sale')}. ${cart.length ? 'The items in your cart will be put on hold.' : 'Nobody can be sold to until you reopen sales.'}`
      });
      if (!ok) return;
      if (!S.hasPin()) {
        const go = await confirm({ title: 'Set your activity PIN', icon: 'lock', ok: 'Set PIN now', cancel: 'Cancel', body: 'You haven’t set a 4-digit activity PIN yet. You’ll need one to close sales and confirm other important actions. It only takes a minute.' });
        if (!go) return;
        const done = await Sec.setupFlow({ email: ctx.store.email, mode: 'set' }); if (!done) return;
        await sleep(250);
      }
      if (!(await askPin('Confirm to close sales', 'Enter your 4-digit PIN to close today’s sales.'))) return;
      if (cart.length) { S.addHeld({ lines: cart.map(l => ({ ...l })), total: cartTotal(), label: 'Held at ' + tm(Date.now()) }); cart = []; }
      const f = S.dayStats();
      S.closeDay({ earned: f.earned, count: f.count, items: f.items, owed: f.owedTotal, creditGiven: f.creditGiven });
      fx('ok'); splash(S.state.closed);
    }
    function splash(info) {
      const w = el('div', 'sx-splash');
      w.innerHTML = `<div class="sx-spin"><svg class="sx-slogo" viewBox="0 0 136 136" aria-hidden="true"><circle cx="68" cy="68" r="65" fill="none" stroke="#0a0a0a" stroke-width="3"/><circle cx="68" cy="68" r="49" fill="#0a0a0a"/><path d="M50 69l12 12 25-27" fill="none" stroke="#e6f53a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></svg>
        <h1>Sales closed<br>for today</h1><p class="sx-sd">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
        <p class="sx-sl">Total earned</p><b class="sx-sa" data-v="${info.earned}">${money(0)}</b>
        <div class="sx-ss"><div><b>${info.count}</b><small>${info.count === 1 ? 'sale' : 'sales'}</small></div><div><b>${info.items}</b><small>${info.items === 1 ? 'item sold' : 'items sold'}</small></div><div><b>${money(info.owed)}</b><small>owed on credit</small></div></div></div>
        <button type="button" class="sx-sdone">Done</button>`;
      document.body.appendChild(w); StrapKit.lock(true); void w.offsetWidth; w.classList.add('on');
      const a = $('.sx-sa', w), to = info.earned, t0 = performance.now() + 500, dur = 1500;
      const step = t => { const p = Math.min(1, Math.max(0, (t - t0) / dur)); a.textContent = money(to * (1 - Math.pow(1 - p, 4))); if (p < 1) requestAnimationFrame(step); else a.textContent = money(to); };
      reduced() ? a.textContent = money(to) : requestAnimationFrame(step);
      $('.sx-sdone', w).onclick = () => { w.classList.remove('on'); StrapKit.lock(false); setTimeout(() => w.remove(), 400); ctx.go('home'); render(); };
    }
    function drawClosed() {
      const c = S.state.closed;
      root.innerHTML = `<div class="sx"><header class="sx-head"><button type="button" class="pm-round" data-home aria-label="Back to home">${ic('back', 22, 2.2)}</button><h1 class="sx-title">Sales</h1></header>
        <div class="sx-closed"><span class="sx-cl-ic">${ic('lock', 30, 1.8)}</span><h2>Sales are closed for today</h2><p>You earned <b>${money(c.earned)}</b> from ${plural(c.count, 'sale')}. Reopen sales if you need to keep selling.</p>
        <button type="button" class="pm-add" data-reopen>Reopen sales</button><button type="button" class="pm-imp" data-home>Back to home</button></div></div>`;
    }
    async function reopen() {
      if (!S.hasPin()) { S.reopenDay(); return render(); }
      if (await askPin('Reopen sales', 'Enter your 4-digit PIN to start selling again.')) { S.reopenDay(); fx('ok'); render(); ctx.toast('Sales reopened'); }
    }

    render();
    if (P() && P().onChange) P().onChange(() => { drawList(); drawBar(); });
    return { onShow() { render(); } };
  }

  /* ---------- receipt sheet (also used by today / history) ---------- */
  function openReceipt(sale, ctx) {
    const tpl = R.load(ctx.store.bizname), fmt = n => ctx.money(n);
    const sh = sheet({ title: 'Receipt', cls: 'sx-rsheet', body: `<div class="sx-rcw">${R.render(tpl, sale, fmt)}</div>
      <div class="sx-acts"><button type="button" class="sx-hold" data-p>${ic('download', 20, 2)} Download</button><button type="button" class="pm-add sx-done" data-s>${ic('upload', 20, 2)} Share</button></div>` });
    sh.body.addEventListener('click', async e => {
      // DOWNLOAD: opens the phone's print sheet; the cashier picks "Save as PDF".
      if (e.target.closest('[data-p]')) R.print(tpl, sale, fmt);
      // SHARE: today this opens the phone's share sheet (WhatsApp is one of the choices) or copies the text.
      // [HOOK 5: WhatsApp] to send the receipt through your own WhatsApp setup, call your server here with R.text(tpl, sale, fmt) and the customer's phone.
      if (e.target.closest('[data-s]')) {
        const t = R.text(tpl, sale, fmt);
        try { if (navigator.share) await navigator.share({ title: sale.no, text: t }); else { await navigator.clipboard.writeText(t); ctx.toast('Receipt copied'); } } catch (err) {}
      }
    });
  }

  /* ---------- today's sales + history (real data from the store) ---------- */
  const head = (t, i) => `<header class="pm-head"><button type="button" class="pm-round" data-go="home" aria-label="Back">${ic('back', 22, 2.2)}</button><h1 class="pm-title">${t}</h1></header>`;
  const saleRows = (list, money) => list.length ? `<ul class="pg-list sx-sl">${list.map(s => `<li class="pg-row sx-sr" data-sid="${esc(s.id)}" tabindex="0" role="button"><span class="pg-ico">${ic(s.method === 'credit' ? 'book' : s.method === 'card' ? 'card' : s.method === 'transfer' ? 'transfer' : 'cash', 22, 1.8)}</span><div><b>${esc(s.no)} · ${money(s.total)}</b><small>${tm(s.ts)} · ${dmy(s.ts)} · ${plural(StrapStore.lineCount(s), 'item')}${s.customer ? ' · ' + esc(s.customer.name) : ''}</small></div><span class="pg-pill${s.method === 'credit' ? ' credit' : ''}">${esc(R.METHOD[s.method])}</span></li>`).join('')}</ul>` : '';
  function wireRows(root, ctx) {
    const open = e => { const r = e.target.closest('.sx-sr'); if (!r) return; const s = S.state.sales.find(x => x.id === r.dataset.sid); if (s) openReceipt(s, ctx); };
    root.addEventListener('click', open); root.addEventListener('keydown', e => { if (e.key === 'Enter') open(e); });
  }
  function today(root, ctx) {
    const draw = () => {
      const st = S.dayStats(), max = Math.max(1, ...Array.from({ length: 12 }, (_, i) => st.sales.filter(s => new Date(s.ts).getHours() === 8 + i).reduce((a, s) => a + s.total, 0)));
      const bars = Array.from({ length: 12 }, (_, i) => st.sales.filter(s => new Date(s.ts).getHours() === 8 + i).reduce((a, s) => a + s.total, 0));
      root.innerHTML = head('Today’s sales') + `<section class="pg-big"><span>Earned today</span><b>${ctx.money(st.earned)}</b><small>${plural(st.count, 'sale')} · ${plural(st.items, 'item')} sold${st.owedTotal ? ` · ${ctx.money(st.owedTotal)} owed on credit` : ''}</small>
        <div class="pg-bars">${bars.map((v, i) => `<i style="--h:${Math.max(8, v / max * 100)}%;--d:${i * 50}ms"></i>`).join('')}</div></section>` +
        (st.count ? saleRows(st.sales, ctx.money) : `<div class="pg-empty">${U.illus('sales')}<h2>Sales will list here</h2><p>Each sale you record today appears in this list, newest first.</p><button type="button" class="pm-add" data-go="new-sale">Start selling</button></div>`);
    };
    draw(); wireRows(root, ctx); return { onShow: draw };
  }
  function history(root, ctx) {
    let range = 30;
    const draw = () => {
      const list = S.sales(range), earned = range ? S.earned(range) : S.earnedAll();
      root.innerHTML = head('Sales history') + `<div class="pm-tabs pg-range">${[['Today', 1], ['7 days', 7], ['30 days', 30], ['All time', 0]].map(([l, v]) => `<button type="button" class="pm-tab${range === v ? ' on' : ''}" data-r="${v}">${l}</button>`).join('')}</div>` +
        (list.length ? `<div class="pg-sum two"><div><b>${ctx.money(earned)}</b><small>Money received</small></div><div><b>${list.length}</b><small>${list.length === 1 ? 'Sale' : 'Sales'}</small></div></div>${saleRows(list, ctx.money)}` : `<div class="pg-empty">${U.illus('sales')}<h2>No sales in this period</h2><p>Completed sales will be listed here so you can look back at any day.</p></div>`);
    };
    root.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { range = +b.dataset.r; draw(); } });
    draw(); wireRows(root, ctx); return { onShow: draw };
  }

  return { mount, today, history, openReceipt };
})();


/* ===== opens the sales screen ===== */
(() => {
  // [HOOK 3] where a cashier lands after logging out
  const LOGIN_URL = 'index.html';
  // [HOOK 1] your products. Replace this empty list with the real ones from your server.
  // Each product looks like:
  const F1 = (() => { try { return JSON.parse(localStorage.getItem('strap.f1') || '{}'); } catch (e) { return {}; } })();
  const PRODUCT_BRANCH = String(F1.active || (F1.branches && F1.branches[0] && F1.branches[0].id) || 'b0');
  const PRODUCT_KEY = 'strap.f1.items.' + PRODUCT_BRANCH;
  const PRODUCTS = (() => { try { const rows = JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]'); return Array.isArray(rows) ? rows : []; } catch (e) { return []; } })();
  // The sales screen asks this small object for the product list and to update stock after a sale.
  const subs = [];
  const products = {
    items: () => PRODUCTS,
    openAdd: () => {},
    setQty(id, qty) { const p = PRODUCTS.find(x => x.id === id); if (p) { p.qty = Math.max(0, qty); try { localStorage.setItem(PRODUCT_KEY, JSON.stringify(PRODUCTS)); } catch (e) {} subs.forEach(f => { try { f(); } catch (e) {} }); } return p; },
    onChange: fn => subs.push(fn)
  };
  // [HOOK 2] the logged-in cashier and the business. The email shows above Log out in the sidebar.
  let store = { name: 'Staff', email: '', bizname: 'My Store', currency: 'NGN' };
  const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 2600); };
  const money = n => { try { return new Intl.NumberFormat('en', { style: 'currency', currency: store.currency, maximumFractionDigits: 0, currencyDisplay: 'narrowSymbol' }).format(n); } catch (e) { return Math.round(n).toLocaleString('en'); } };
  // Everything the sales screen needs from the app around it.
  // signOut runs when the cashier confirms Log out: tell your server, then go to the login page.
  const ctx = { toast, esc: StrapUI.esc, money, cur: store.currency, store, go: () => {}, products: () => products, signOut: async () => { try { await StrapAPI.call('POST', 'staff/signout'); } finally { try { localStorage.removeItem('staff.session'); sessionStorage.removeItem('staff.session'); } catch(e) {} location.replace(LOGIN_URL); } } };
  // Load the authenticated staff identity and the owning business before rendering the sidebar.
  (async () => {
    try {
      const r = await StrapAPI.call('GET', 'data');
      if (!r || !r.ok || !r.staff) { location.replace(LOGIN_URL); return; }
      store.name = r.staff.name || 'Staff'; store.email = r.staff.email || '';
      store.bizname = r.staff.bizname || 'My Store'; store.currency = r.staff.currency || 'NGN';
      ctx.cur = store.currency;
      StrapSales.mount(document.getElementById('sales-root'), ctx);
    } catch (e) { toast('Could not load your staff account. Please sign in again.'); }
  })();
})();
</script>
