<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Strap – Stock</title>
<!--
  STRAP – STOCK MANAGER SCREENS (one file: HTML + CSS + JavaScript)

  WHAT THIS IS
    What the stock manager sees: Products (add, edit, delete, import from CSV, export), Inventory (stock +/- per
    product), Collections, and a hamburger sidebar (Messages "coming soon", email above Log out).
    The stock manager does not see sales, money or settings.

  FILE LAYOUT (search for these banners)
    <style>                          all the CSS (the last block, "stock manager additions", is the new sidebar styling)
    "connection stand-in"            fake StrapAPI so the page runs on its own. Delete it when you use your real api.js
    picker / ui / store / kit        shared helpers (unchanged)
    "products.js"                    the Products screen (only change: hamburger in its header)
    "pages.js"                       Inventory and Collections (only change: hamburger in the header)
    "opens the stock manager screens"   last block: login details, where products are saved, sidebar

  PLACES YOU WILL EDIT (search for the word HOOK)
    HOOK 1  read() / write()         last block: load and save the products on your server
    HOOK 2  store.email / name       last block: the logged-in stock manager
    HOOK 3  LOGIN_URL                last block: where Log out goes
    HOOK 4  importFromSite           "Import from a website" gives sample products until you connect it
    HOOK 5  StrapAPI.upload()        product photos: send to your server instead of keeping them in the page

  TIP: the cashier page needs the same product list. Make both read it from your server (HOOK 1 here, PRODUCTS there).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&family=DM+Serif+Display&display=swap">
<style>
/* ===== dashboard.css ===== */
/* Strap dashboard page: base + dashboard styles (loader styles are in loader.css) */
:root{--lemon:#e6f53a;--black:#0a0a0a;--ink:#141414;--edge:#2b2b2b;--mute:#8d8d86}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Sora","Helvetica Neue",Arial,sans-serif;background:var(--lemon);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font-family:inherit}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:#fff;color:var(--black);font:500 13px "Sora",sans-serif;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:60;box-shadow:0 10px 30px -10px rgba(10,10,10,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- dashboard ---------- */
body.is-dash{background:var(--black)}
.dash{min-height:100vh;min-height:100dvh;background:var(--black);color:var(--black)}
.dtop{height:calc(env(safe-area-inset-top,0px) + 18px)}
.dsheet{position:relative;max-width:560px;margin:0 auto;background:#fff;border-radius:34px 34px 0 0;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - 18px);
  padding:22px clamp(18px,5.5vw,26px) calc(env(safe-area-inset-bottom,0px) + 128px)}
.dash:not(.go) .dsheet{transform:translateY(60px);opacity:0}
.dash.go .dsheet{animation:sheetUp .8s cubic-bezier(.2,.8,.2,1) .25s backwards}
@keyframes sheetUp{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}

/* staggered entrance for every block */
.dash:not(.go) .in{opacity:0}
.dash.go .in{animation:cardIn .7s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms + 450ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* header */
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.av{flex:none;width:46px;height:46px;border-radius:15px;background:var(--lemon);color:var(--black);display:grid;place-items:center;overflow:hidden;font:700 17px "Sora",sans-serif;letter-spacing:-.02em}
.av img{width:100%;height:100%;object-fit:cover}
.sn{font-size:clamp(18px,5vw,21px);font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:1px solid #ececea;color:var(--black);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 22px -10px rgba(10,10,10,.3);transition:transform .15s}
.bell:active{transform:scale(.92)}
.bell i{position:absolute;top:13px;right:14px;width:9px;height:9px;border-radius:50%;background:#ff5a4d;border:2px solid #fff}
.bell.ring svg{animation:ring .7s ease-in-out;transform-origin:50% 8%}
@keyframes ring{15%{transform:rotate(16deg)}35%{transform:rotate(-13deg)}55%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}100%{transform:none}}

/* greeting: lines slide up out of a mask */
.hi{margin-top:clamp(30px,6vh,48px);font-size:clamp(32px,9.4vw,42px);line-height:1.12;font-weight:600;letter-spacing:-.045em}
.ln{display:block;overflow:hidden;padding-bottom:9px;margin-bottom:-9px}
.ln>span{display:inline-block}
.dash:not(.go) .ln>span{transform:translateY(115%)}
.dash.go .ln>span{animation:lineUp .85s cubic-bezier(.2,.9,.2,1) backwards}
.dash.go .ln:nth-child(1)>span{animation-delay:.55s}
.dash.go .ln:nth-child(2)>span{animation-delay:.68s}
@keyframes lineUp{from{transform:translateY(115%)}to{transform:none}}
.nm{text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:7px}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:clamp(30px,6vh,44px) 2px 16px;font-size:clamp(19px,5.2vw,22px);font-weight:400;letter-spacing:-.02em}
.sec small{font-size:12.5px;font-weight:500;color:var(--mute);letter-spacing:0}

/* revenue: the one long card */
.rev{position:relative;overflow:hidden;background:var(--black);color:#fff;border-radius:32px;padding:22px 22px 0;margin-bottom:14px;
  box-shadow:0 22px 40px -24px rgba(10,10,10,.6);transition:transform .2s}
.rev:active{transform:scale(.985)}
.rev:focus-visible,.sc:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
.glow{position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(230,245,58,.28),rgba(230,245,58,0));animation:glow 4.5s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{transform:translate(-18px,16px) scale(1.15);opacity:.7}}
.rtop{position:relative;display:flex;align-items:center;gap:12px}
.rev .ic{width:46px;height:46px;border-radius:16px;background:var(--lemon);color:var(--black);display:grid;place-items:center}
.rev .lb{font-size:14.5px;font-weight:500;color:rgba(255,255,255,.72)}
.amt{position:relative;display:block;margin-top:22px;font-size:clamp(36px,11.5vw,50px);line-height:1;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta{position:relative;display:inline-flex;align-items:center;gap:5px;margin-top:14px;padding:6px 12px 6px 9px;border-radius:999px;background:rgba(230,245,58,.14);color:var(--lemon);font-size:12.5px;font-weight:600}
.spark{display:block;width:calc(100% + 44px);margin:6px -22px 0;height:auto;overflow:visible}
.sl{stroke-dasharray:1;stroke-dashoffset:1}
.sa,.sd{opacity:0}
.dash.go .sl{animation:lineDraw 1.6s cubic-bezier(.5,0,.2,1) 1s forwards}
.dash.go .sa{animation:fadeIn 1s ease-out 1.8s forwards}
.dash.go .sd{animation:dotPop .5s cubic-bezier(.2,1.6,.3,1) 2.4s forwards,dotPulse 1.8s ease-in-out 3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes lineDraw{to{stroke-dashoffset:0}}
@keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes dotPulse{50%{transform:scale(1.5);opacity:.55}}

/* stat cards */
.sc{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #ececea;border-radius:28px;padding:18px;margin-bottom:12px;
  box-shadow:0 12px 28px -18px rgba(10,10,10,.28);transition:transform .2s,box-shadow .2s}
.sc:active{transform:scale(.985)}
.sc .ic{flex:none;width:58px;height:58px;border-radius:20px;background:#f3f3ee;color:var(--black);display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,1.5,.3,1)}
.sc:active .ic{transform:rotate(-8deg) scale(1.08)}
.tx{display:flex;flex-direction:column;min-width:0}
.sc .lb{font-size:14px;font-weight:500;color:var(--mute)}
.vl{font-size:clamp(28px,8vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:2px}
.sb{font-size:12.5px;font-weight:500;color:#9a9a93;margin-top:2px}
.sc.warn{background:#fff6f4;border-color:#ffd9d3}
.sc.warn .ic{background:#ffe3de;color:#d6342a}
.sc.warn .vl{color:#d6342a}
.sc.warn .ic svg{animation:wobble 2.6s ease-in-out 2.5s infinite}
@keyframes wobble{0%,86%,100%{transform:none}90%{transform:rotate(-9deg)}94%{transform:rotate(8deg)}98%{transform:rotate(-4deg)}}

/* other tabs */
.pane:not([hidden]){animation:paneIn .4s cubic-bezier(.2,.9,.2,1)}
@keyframes paneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pt{margin-top:34px;font-size:clamp(32px,9vw,40px);font-weight:600;letter-spacing:-.045em}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(60px,14vh,120px) 12px 0}
.empty .ic{width:76px;height:76px;border-radius:26px;background:#f3f3ee;display:grid;place-items:center;margin-bottom:20px;animation:float 3.4s ease-in-out infinite}
.empty h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.empty p{margin-top:8px;max-width:280px;font-size:14px;line-height:1.55;font-weight:500;color:var(--mute)}
@keyframes float{50%{transform:translateY(-8px)}}
.row{display:flex;align-items:center;gap:14px;width:100%;margin-top:24px;padding:18px;border-radius:24px;background:#fff;border:1px solid #ececea;
  font:600 16px "Sora",sans-serif;color:var(--black);cursor:pointer;text-align:left;transition:transform .15s}
.row:active{transform:scale(.985)}

/* floating nav */
.dnav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.tabs{position:relative;pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:380px;padding:8px;border-radius:999px;background:#fff;border:1px solid rgba(10,10,10,.06);
  box-shadow:0 18px 40px -12px rgba(10,10,10,.35),0 2px 8px rgba(10,10,10,.06)}
.dash:not(.go) .tabs{transform:translateY(160%)}
.dash.go .tabs{animation:navUp .9s cubic-bezier(.2,1.25,.3,1) 1.2s backwards}
@keyframes navUp{from{transform:translateY(160%)}to{transform:none}}
.bub{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px)/4);transition:transform .45s cubic-bezier(.3,1.35,.4,1)}
.bub i{position:absolute;inset:0 4px;border-radius:999px;background:#efefec}
.tab{position:relative;z-index:1;height:58px;display:grid;place-items:center;background:none;border:0;border-radius:999px;color:#8a8a84;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .25s,transform .2s}
.tab:active{transform:scale(.88)}
.tab.on{color:var(--black)}
.tab svg{transition:transform .4s cubic-bezier(.2,1.6,.3,1)}
.tab.on svg{transform:scale(1.1)}
.tab:focus-visible{outline:3px solid var(--lemon);outline-offset:-3px}
@media(prefers-reduced-motion:reduce){.sl{stroke-dashoffset:0}.sa,.sd{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== products.css ===== */
/* Strap – Products tab, bottom sheet, add-product page */
body.pm-open{overflow:hidden}
.pm{padding-top:6px}
.pm-head{position:relative;display:flex;align-items:center;gap:10px;margin-top:26px}
.pm-title{flex:1;display:flex;align-items:center;gap:12px;font-size:clamp(22px,6.4vw,26px);font-weight:600;letter-spacing:-.04em;min-width:0}
.pm-tico{width:38px;height:38px;border-radius:13px;background:var(--lemon);display:grid;place-items:center;flex:none}
.pm-round{flex:none;width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid #ececea;color:var(--black);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -10px rgba(10,10,10,.3);transition:transform .15s}
.pm-round:active{transform:scale(.92)}
.pm-add,.pm-pill{height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--black);color:#fff;font:600 15px "Sora",sans-serif;letter-spacing:-.01em;cursor:pointer;box-shadow:0 12px 24px -12px rgba(10,10,10,.6);transition:transform .15s}
.pm-add:active,.pm-pill:active{transform:scale(.96)}
.pm-pill{background:#efefec;color:var(--black);box-shadow:none;height:46px}
.pm-pill.dark{background:var(--black);color:#fff;flex:1}
.pm-pill:disabled{opacity:.6}
.pm-ghost{height:46px;padding:0 18px;border-radius:999px;border:0;background:none;font:500 15px "Sora",sans-serif;color:var(--black);cursor:pointer}

/* export popover */
.pm-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:15;width:min(280px,86vw);padding:8px;background:#fff;border:1px solid #ececea;border-radius:22px;box-shadow:0 24px 50px -16px rgba(10,10,10,.4);animation:pmPop .22s cubic-bezier(.2,1.2,.3,1);transform-origin:top right}
@keyframes pmPop{from{opacity:0;transform:scale(.92) translateY(-6px)}}
.pm-pop-h{padding:10px 12px 8px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em;text-transform:uppercase}
.pm-pi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:16px;font:500 14.5px "Sora",sans-serif;color:var(--black);cursor:pointer;text-align:left}
.pm-pi:active{background:#f3f3ee}
.pm-pico{width:38px;height:38px;border-radius:13px;background:#f3f3ee;display:grid;place-items:center;flex:none}
.pm-pi em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--lemon)}
.pm-pi.soon{color:#8d8d86}


/* search */
.pm-search{position:relative;display:flex;align-items:center;gap:6px;margin-top:18px;height:56px;padding:0 14px;border:1px solid #e4e4df;border-radius:20px;background:#fff;box-shadow:0 8px 20px -16px rgba(10,10,10,.3)}
.pm-filter{display:flex;align-items:center;gap:2px;flex:none;position:relative;font-size:14px;font-weight:600}
.pm-filter select{appearance:none;-webkit-appearance:none;border:0;background:none;font:600 14px "Sora",sans-serif;color:var(--black);padding:8px 18px 8px 4px;outline:0}
.pm-filter svg{position:absolute;right:0;pointer-events:none}
.pm-sico{display:grid;place-items:center;color:#6f6f69;margin-left:4px}
.pm-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 15px "Sora",sans-serif;color:var(--black);height:100%}
.pm-search input::placeholder{color:#8d8d86}
.pm-search:focus-within{border-color:var(--black)}
.pm-selbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 14px 10px 18px;border-radius:16px;background:var(--black);color:#fff;font-size:14px}
.pm-selbar button{border:0;background:rgba(255,255,255,.14);color:#fff;font:600 13px "Sora",sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}

/* list */
.pm-list{list-style:none;margin-top:8px}
.pm-row{position:relative;display:flex;align-items:flex-start;gap:14px;padding:18px 0;border-bottom:1px solid #ececea}
.pm-ck{flex:none;margin-top:2px}
.pm-ck input{position:absolute;opacity:0;width:0;height:0}
.pm-ck span{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;border:1.8px solid #c9c9c2;color:transparent;background:#fff;transition:.15s}
.pm-ck input:checked+span{background:var(--black);border-color:var(--black);color:var(--lemon)}
.pm-ck input:focus-visible+span{outline:3px solid var(--lemon);outline-offset:2px}
.pm-img{flex:none;width:84px;height:84px;border-radius:20px;border:1px solid #e9e9e4;background:#f7f7f3;display:grid;place-items:center;color:#8d8d86;overflow:hidden}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.pm-info b{font-size:16.5px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.pm-info small{font-size:14px;font-weight:500;color:#6f6f69}
.pm-badge{padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--lemon);color:var(--black)}
.pm-badge.draft{background:#ececea;color:#55554f}
.pm-badge.archived{background:#ffe3de;color:#b4281f}
.pm-price{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;margin-top:2px}
.pm-row.sk .pm-img,.pm-row.sk b,.pm-row.sk i{background:linear-gradient(90deg,#f1f1ed,#fafaf7,#f1f1ed);background-size:200% 100%;animation:pmSk 1.2s linear infinite;border:0}
.pm-row.sk b{display:block;width:150px;height:18px;border-radius:6px}.pm-row.sk i{display:block;width:90px;height:14px;border-radius:6px}
@keyframes pmSk{to{background-position:-200% 0}}
.pm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 12px 0}
.pm-empty .ic{width:76px;height:76px;border-radius:26px;background:#f3f3ee;display:grid;place-items:center;margin-bottom:20px}
.pm-empty h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.pm-empty p{margin:8px 0 20px;max-width:280px;font-size:14px;line-height:1.55;font-weight:500;color:var(--mute)}
.pm-empty.slim{padding-top:36px}

/* bottom sheet */
.pm-layer{position:fixed;inset:0;z-index:45}
.pm-scrim{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .35s}
.pm-layer.on .pm-scrim{opacity:1}
.pm-sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:32px 32px 0 0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);max-height:88dvh;overflow-y:auto;box-shadow:0 -20px 50px -20px rgba(10,10,10,.4)}
.pm-layer.on .pm-sheet{transform:translateY(0)}
.pm-grab{position:sticky;top:0;z-index:2;display:grid;place-items:center;height:30px;margin:0 -20px;background:#fff;touch-action:none}
.pm-grab i{width:44px;height:5px;border-radius:5px;background:#d9d9d3}
.pm-sh{display:flex;align-items:center;gap:8px;padding:4px 0 14px}
.pm-sh h2{flex:1;font-size:21px;font-weight:600;letter-spacing:-.035em}
.pm-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#f3f3ee;color:var(--black);display:grid;place-items:center;cursor:pointer}
.pm-x:active{transform:scale(.9)}
.pm-view:not([hidden]){animation:pmV .3s cubic-bezier(.2,.9,.2,1)}
@keyframes pmV{from{opacity:0;transform:translateX(16px)}}
.pm-opt{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:14px;border-radius:24px;border:1px solid #ececea;background:#fff;color:var(--black);text-align:left;cursor:pointer;transition:transform .15s,background .15s}
.pm-opt:active{transform:scale(.985);background:#fafaf7}
.pm-oi{flex:none;width:52px;height:52px;border-radius:18px;background:var(--lemon);display:grid;place-items:center}
.pm-ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pm-ot b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.pm-ot small{font-size:12.5px;font-weight:500;color:var(--mute)}
.pm-opt>svg:last-child{color:#a9a9a2;flex:none}
.pm-sites{list-style:none;display:flex;flex-direction:column;gap:2px}
.pm-site{display:flex;align-items:center;gap:14px;width:100%;padding:11px 8px;border:0;border-radius:18px;background:none;color:var(--black);cursor:pointer;text-align:left}
.pm-site:active{background:#f3f3ee}
.pm-site b{flex:1;font-size:16px;font-weight:600;letter-spacing:-.02em}
.pm-site>svg{color:#a9a9a2}
.pm-fav{flex:none;width:44px;height:44px;border-radius:14px;background:#f7f7f3;border:1px solid #ececea;display:grid;place-items:center;overflow:hidden}
.pm-fav img{width:28px;height:28px;object-fit:contain;border-radius:6px}
.pm-fav.nf{font:700 17px "Sora",sans-serif}

/* add product page */
.pm-page{position:fixed;inset:0;z-index:40;background:#f7f7f3;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.pm-page.on{transform:none}
.pm-pbar{position:sticky;top:0;z-index:3;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 8px;background:linear-gradient(#f7f7f3 70%,rgba(247,247,243,0))}
.pm-form{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 120px)}
.pm-form h1{margin:10px 4px 18px;font-size:clamp(32px,9vw,40px);font-weight:600;letter-spacing:-.045em}
.pm-h{margin:26px 6px 12px;font-size:20px;font-weight:600;letter-spacing:-.03em}
.pm-h2row{display:flex;align-items:center;justify-content:space-between}
.pm-icobtn{border:0;background:none;color:var(--black);width:44px;height:44px;display:grid;place-items:center;cursor:pointer;margin-top:14px}
.pm-card{background:#fff;border:1px solid #ececea;border-radius:28px;padding:16px;margin-bottom:14px;box-shadow:0 12px 28px -22px rgba(10,10,10,.3)}
.pm-card.slim{padding:16px 18px}
.pm-lb{margin:20px 4px 10px;font-size:15px;font-weight:600}
.pm-card>.pm-lb:first-child,.pm-card div[data-f=shipbox]>.pm-lb:first-child{margin-top:16px}
.pm-hint,.pm-muted{margin:12px 4px 2px;font-size:13px;line-height:1.55;font-weight:500;color:var(--mute)}
.pm-muted{margin:0}
.pm-sep{height:1px;background:#ececea;margin:16px -16px}
.pm-fl{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:62px;padding:10px 16px;margin-top:10px;border:1.5px solid #e4e4df;border-radius:18px;background:#fff;transition:border-color .2s}
.pm-fl:first-child{margin-top:0}
.pm-fl:focus-within{border-color:var(--black)}
.pm-fl.bad{border-color:#d6342a;animation:pmShake .4s}
@keyframes pmShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pm-fl>span{font-size:12.5px;font-weight:500;color:#6f6f69}
.pm-fl input,.pm-fl select,.pm-fl textarea{width:100%;border:0;outline:0;background:none;font:500 16px "Sora",sans-serif;color:var(--black);padding:0;resize:none}
.pm-fl input::placeholder,.pm-fl textarea::placeholder{color:#8d8d86}
.pm-fl:has(>span:first-child:not(.cur)) input{margin-top:2px}
.pm-fl.sel select,.pm-fl.sel input{appearance:none;-webkit-appearance:none;padding-right:28px}
.pm-fl.sel>svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:#55554f}
.pm-fl.sel:has(>span) select,.pm-fl.sel:has(>span) input{margin-top:2px}
.pm-fl.money{flex-direction:row;align-items:center;gap:8px}
.pm-fl.money .cur{font-size:16px;font-weight:600;color:var(--black)}
.pm-fl.stat{margin:14px 0}
.pm-fl.sm{min-width:84px;padding-right:10px;margin-top:0}
.pm-fl.sm select{padding-right:22px}
.pm-fl.sm>svg{right:10px}
.rv{animation:pmV .25s ease-out}
.pm-chips{display:flex;flex-wrap:wrap;gap:8px}
.pm-chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border:0;border-radius:999px;background:#f1f1ed;color:var(--black);font:500 14.5px "Sora",sans-serif;cursor:pointer;transition:background .2s,transform .15s}
.pm-chip:active{transform:scale(.95)}
.pm-chip.on{background:var(--lemon);font-weight:600}
.pm-chip em{font-style:normal;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#e4e4df}
.pm-chip em.on{background:var(--black);color:var(--lemon)}
.pm-trow{display:flex;align-items:center;gap:10px;min-height:44px}
.pm-trow h3{flex:1;font-size:19px;font-weight:600;letter-spacing:-.03em}
.pm-tl{font-size:13.5px;font-weight:500;color:#6f6f69}
.pm-sw{flex:none;position:relative;width:52px;height:30px;border-radius:999px;border:0;background:#d4d4cd;cursor:pointer;transition:background .25s}
.pm-sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.pm-sw.on{background:var(--black)}
.pm-sw.on i{transform:translateX(22px);background:var(--lemon)}
.pm-inv{margin-top:14px;padding:6px;border:1.5px solid #e4e4df;border-radius:20px}
.pm-invh{display:flex;justify-content:space-between;padding:10px 12px;border-radius:14px;background:#f7f7f3;font-size:13px;font-weight:600;color:#55554f}
.pm-invr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 8px 8px}
.pm-invr b{font-size:16px;font-weight:600}
.pm-step{display:flex;align-items:center;gap:6px;padding:5px;border:1.5px solid #e4e4df;border-radius:16px}
.pm-step input{width:46px;border:0;outline:0;font:500 16px "Sora",sans-serif;padding-left:8px;background:none;-moz-appearance:textfield}
.pm-step input::-webkit-inner-spin-button{display:none}
.pm-step button{width:40px;height:40px;border:0;border-radius:12px;background:#f1f1ed;font:500 20px "Sora",sans-serif;cursor:pointer}
.pm-step button:active{background:var(--lemon)}
.pm-dim{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pm-dim .pm-fl{margin-top:0}
.pm-dim i{display:none}
.pm-drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 14px;border:1.5px dashed #c9c9c2;border-radius:22px;background:#fcfcfa;text-align:center}
.pm-dacts{display:flex;align-items:center;gap:6px}
.pm-drop small{font-size:13px;color:#6f6f69;font-weight:500}
.pm-thumbs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pm-th{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;background:#f1f1ed;display:grid;place-items:center}
.pm-th img{width:100%;height:100%;object-fit:cover}
.pm-th button{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(10,10,10,.75);color:#fff;display:grid;place-items:center;cursor:pointer}
.pm-rte{border:1.5px solid #e4e4df;border-radius:20px;overflow:hidden}
.pm-rte:focus-within{border-color:var(--black)}
.pm-tb{display:flex;align-items:center;gap:2px;padding:8px;background:#f7f7f3;overflow-x:auto}
.pm-tb>button{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:none;font:500 17px "Sora",sans-serif;color:var(--black);cursor:pointer;display:grid;place-items:center}
.pm-tb>button:active{background:var(--lemon)}
.pm-sel{position:relative;display:flex;align-items:center;margin-right:6px;flex:none}
.pm-sel select{appearance:none;-webkit-appearance:none;border:0;background:none;font:500 14.5px "Sora",sans-serif;padding:10px 24px 10px 8px;outline:0;color:var(--black)}
.pm-sel svg{position:absolute;right:4px;pointer-events:none}
.pm-ed{min-height:170px;padding:14px 16px;font:500 15.5px/1.6 "Sora",sans-serif;outline:0}
.pm-ed:empty::before{content:attr(data-ph);color:#8d8d86;pointer-events:none}
.pm-ed h2{font-size:20px;margin:8px 0}.pm-ed h3{font-size:17px;margin:8px 0}.pm-ed ul{padding-left:22px}
.pm-addopt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;border:0;background:none;font:600 16px "Sora",sans-serif;color:var(--black);cursor:pointer;text-align:left;padding:0 4px}
.pm-opt2{padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid #ececea}
.pm-chan{display:flex;align-items:center;gap:12px;font-size:16px}
.pm-seoprev b{display:block;color:#1a4fd6;font-size:17px;font-weight:600;margin-bottom:4px}
.pm-seoprev small{font-size:13.5px;line-height:1.5;color:#55554f;font-weight:500}
[data-f=seo] .pm-fl{margin-top:14px}
.pm-tagbox{margin-top:10px;padding:12px 16px;border:1.5px solid #e4e4df;border-radius:18px}
.pm-tagbox>span{display:block;font-size:12.5px;font-weight:500;color:#6f6f69;margin-bottom:8px}
.pm-tl2{display:flex;flex-wrap:wrap;gap:6px}
.pm-tl2:not(:empty){margin-bottom:8px}
.pm-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;background:var(--lemon);font-size:13.5px;font-weight:600}
.pm-tag button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:rgba(10,10,10,.12);cursor:pointer}
.pm-taginp{flex:1;min-width:140px;height:36px;border:0;outline:0;background:#f7f7f3;border-radius:12px;padding:0 12px;font:500 14.5px "Sora",sans-serif}
.pm-save{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;max-width:560px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(247,247,243,0),#f7f7f3 32%)}
.pm-page[hidden] .pm-save{display:none}
.pm-save .pm-ghost{background:#fff;border:1px solid #e4e4df;height:50px;padding:0 22px}
.pm-save .pm-pill{height:50px;font-size:15.5px}
@media(prefers-reduced-motion:reduce){.pm-sheet,.pm-page,.pm-scrim{transition:none!important}}

/* ===== pages.css ===== */
/* Strap – sidebar drawer, sales card, page chrome, products box, import/export flows */

/* ---------- plain outline title icon (no colour) ---------- */
.pm-tico{width:auto;height:auto;background:none;border-radius:0;color:var(--black);display:grid;place-items:center;flex:none}
.pm-head{margin-top:14px}
.pm-add.sm{height:44px;padding:0 18px;font-size:14.5px}
.pm-add{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pm-add.wide{width:100%;margin-top:14px;height:54px}
.pm-add:disabled{opacity:.4;box-shadow:none}
.pm-imp{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;border:0;background:#efefec;color:var(--black);font:600 15px "Sora",sans-serif;cursor:pointer;transition:transform .15s}
.pm-imp:active{transform:scale(.96)}

/* ---------- bottom nav: plain black outline icons, each with its own little move ---------- */
.tab{color:var(--black)}
.tab svg{transition:transform .3s}
.tab.on svg{transform:none}
.tabs.none .bub{opacity:0}
.bub{transition:transform .45s cubic-bezier(.3,1.35,.4,1),opacity .25s}
.tab.pop.t0 svg{animation:nHome .55s cubic-bezier(.2,1.6,.3,1)}
.tab.pop.t1 svg{animation:nInbox .5s ease-out}
.tab.pop.t2 svg{animation:nTag .6s ease-in-out;transform-origin:30% 20%}
.tab.pop.t3 svg{animation:nMenu .5s cubic-bezier(.2,1.5,.3,1)}
@keyframes nHome{40%{transform:translateY(-6px)}}
@keyframes nInbox{30%{transform:translateY(5px) scale(.94)}70%{transform:translateY(-2px)}}
@keyframes nTag{25%{transform:rotate(-16deg)}55%{transform:rotate(11deg)}80%{transform:rotate(-4deg)}}
@keyframes nMenu{40%{transform:scaleX(1.25)}}
.dash.focus .dnav{display:none}
.dash.focus .dsheet{padding-bottom:40px}

/* ---------- sales card on home ---------- */
.sl-card{background:#fff;border:1px solid #ececea;border-radius:30px;padding:18px;margin-bottom:12px;box-shadow:0 12px 28px -18px rgba(10,10,10,.28)}
.sl-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sl-ic{flex:none;width:56px;height:56px;border-radius:20px;background:#f3f3ee;display:grid;place-items:center}
.sl-top b{display:block;font-size:17px;font-weight:600;letter-spacing:-.025em}
.sl-top small{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--mute)}
.sl-btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;width:100%;height:58px;padding:0 8px 0 24px;border:0;border-radius:999px;background:var(--black);color:#fff;font:600 16px "Sora",sans-serif;letter-spacing:-.01em;cursor:pointer;transition:transform .15s}
.sl-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out 2.6s infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.sl-btn i{width:42px;height:42px;border-radius:50%;background:var(--lemon);color:var(--black);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,1.5,.3,1)}
.sl-btn:active{transform:scale(.98)}.sl-btn:active i{transform:rotate(45deg)}
.sl-link{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;height:54px;padding:0 16px;border:0;border-radius:20px;background:#f6f6f2;color:var(--black);font:600 15px "Sora",sans-serif;cursor:pointer;text-align:left;transition:transform .15s,background .15s}
.sl-link span{flex:1}.sl-link>svg:last-child{color:#a9a9a2}
.sl-link:active{transform:scale(.985);background:#efefec}

/* ---------- sidebar drawer ---------- */
.dr{position:fixed;inset:0;z-index:55;pointer-events:none}
.dr.on{pointer-events:auto}
.dr-scrim{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .35s}
.dr.on .dr-scrim{opacity:1}
.dr-panel{position:absolute;top:0;bottom:0;left:0;width:min(88vw,360px);display:flex;flex-direction:column;background:#fff;border-radius:0 32px 32px 0;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-104%);transition:transform .45s cubic-bezier(.2,.9,.25,1);box-shadow:20px 0 50px -20px rgba(10,10,10,.4)}
.dr.on .dr-panel{transform:none}
.dr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 16px}
.dr-top .av{width:42px;height:42px;border-radius:14px;font-size:15px}
.dr-top .sn{font-size:17px}
.ds-open{display:flex;align-items:center;justify-content:space-between;width:100%;height:60px;padding:0 9px 0 24px;border:0;border-radius:999px;background:var(--black);color:#fff;font:600 17px "Sora",sans-serif;letter-spacing:-.015em;cursor:pointer;box-shadow:0 14px 26px -14px rgba(10,10,10,.7);transition:transform .15s}
.ds-open i{width:44px;height:44px;border-radius:50%;background:var(--lemon);color:var(--black);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,1.5,.3,1)}
.ds-open:active{transform:scale(.98)}.ds-open:active i{transform:rotate(45deg)}
.ds-nav{flex:1;overflow-y:auto;margin:14px -4px 0;padding:0 4px;scrollbar-width:none}
.ds-nav::-webkit-scrollbar{display:none}
.ds-h{margin:14px 14px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.ds-sep{height:1px;background:#ececea;margin:10px 14px}
.ds-i,.ds-s{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--black);font-family:"Sora",sans-serif;cursor:pointer;text-align:left;border-radius:18px;transition:background .15s,transform .15s}
.ds-i{height:54px;padding:0 14px;font-size:16px;font-weight:500;letter-spacing:-.015em}
.ds-i:active,.ds-s:active{transform:scale(.985);background:#f3f3ee}
.ds-i.on,.ds-grp.has>.ds-i{background:#f3f3ee;font-weight:600}
.ds-ic{display:grid;place-items:center;flex:none}
.ds-chev{margin-left:auto;display:grid;place-items:center;color:#8d8d86;transition:transform .3s}
.ds-grp.open .ds-chev{transform:rotate(180deg)}
.ds-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.9,.25,1)}
.ds-sub>div{overflow:hidden;min-height:0}
.ds-grp.open .ds-sub{grid-template-rows:1fr}
.ds-s{height:46px;padding:0 14px 0 52px;font-size:15px;font-weight:500;color:#55554f;position:relative}
.ds-s.on{color:var(--black);font-weight:600;background:none}
.ds-s.on::before{content:"";position:absolute;left:36px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--black)}
.ds-b{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--lemon);color:var(--black)}
.dr .ds-i,.dr .ds-open{opacity:0;transform:translateX(-14px)}
.dr.on .ds-i,.dr.on .ds-open{opacity:1;transform:none;transition:opacity .4s,transform .45s cubic-bezier(.2,.9,.25,1);transition-delay:calc(var(--n,0)*30ms + 120ms)}
.dr.on .ds-i:active{transform:scale(.985)}

/* ---------- generic pages ---------- */
.pg-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 8px 8px}
.il{width:min(230px,70%);height:auto;overflow:visible;margin-bottom:8px}
.il .fl{animation:ilFloat 3.6s ease-in-out infinite}
.il .tw{animation:ilFloat 3.6s ease-in-out .5s infinite reverse}
.il .sp{animation:twinkle 2.6s ease-in-out infinite}.il .s2{animation-delay:.9s}.il .s3{animation-delay:1.7s}
@keyframes ilFloat{50%{transform:translateY(-6px)}}
@keyframes twinkle{50%{opacity:.15}}
.pg-empty h2{font-size:22px;font-weight:600;letter-spacing:-.035em;margin-top:6px}
.pg-empty p{margin:8px 0 22px;max-width:290px;font-size:14px;line-height:1.55;font-weight:500;color:var(--mute)}
.pg-empty p:last-child{margin-bottom:0}
.pg-list{list-style:none;margin-top:18px}
.pg-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #ececea;animation:pmV .3s ease-out}
.pg-ico{flex:none;width:52px;height:52px;border-radius:17px;border:1px solid #e9e9e4;background:#f7f7f3;display:grid;place-items:center;color:var(--black);overflow:hidden}
.pg-ico img{width:100%;height:100%;object-fit:cover}
.pg-row>div:not(.pm-step){flex:1;min-width:0}
.pg-row b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
.pg-row small{display:block;margin-top:3px;font-size:13px;font-weight:500;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-x{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:none;color:#8d8d86;display:grid;place-items:center;cursor:pointer}
.pg-x:active{background:#f3f3ee;color:var(--black)}
.pg-q{min-width:34px;text-align:center;font-weight:600;font-size:15px}
.pg-row .pm-step{padding:4px;gap:2px}.pg-row .pm-step button{width:36px;height:36px}
.pg-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.pg-sum div{padding:14px 12px;border:1px solid #ececea;border-radius:20px;background:#fff}
.pg-sum b{display:block;font-size:24px;font-weight:700;letter-spacing:-.04em}
.pg-sum small{font-size:11.5px;font-weight:500;color:var(--mute)}
.pg-locks{display:grid;gap:10px;margin-top:26px}
.pg-lock{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;padding:14px;border:1px dashed #d4d4cd;border-radius:22px}
.pg-lock span{grid-row:span 2;width:48px;height:48px;border-radius:16px;background:#f7f7f3;display:grid;place-items:center}
.pg-lock b{font-size:15.5px;font-weight:600}
.pg-lock small{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--mute)}
.pg-rows{margin-top:6px;border:1px solid #ececea;border-radius:24px;background:#fff;overflow:hidden}
.pg-r{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 18px;border:0;border-top:1px solid #f1f1ed;background:none;font:500 15.5px "Sora",sans-serif;color:var(--black);text-align:left;cursor:pointer}
.pg-r:first-child{border-top:0}
.pg-r span{flex:1}
.pg-r b{font-weight:500;color:var(--mute);font-size:14.5px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-r>svg:last-child{color:#a9a9a2}
.pg-r.static{cursor:default}
.pg-pill{padding:5px 11px;border-radius:999px;background:#f1f1ed;font-size:12.5px!important;color:#55554f!important}
.pg-prof{display:flex;align-items:center;gap:14px;margin-top:20px;padding:16px;border:1px solid #ececea;border-radius:26px;background:#fff}
.pg-prof .av{width:56px;height:56px;border-radius:18px}
.pg-prof b{display:block;font-size:18px;font-weight:600;letter-spacing:-.025em}
.pg-prof small{font-size:13px;color:var(--mute);font-weight:500}
.pg-big{margin-top:20px;padding:22px 20px 16px;border-radius:28px;background:var(--black);color:#fff}
.pg-big span{font-size:14px;font-weight:500;color:rgba(255,255,255,.7)}
.pg-big b{display:block;margin-top:8px;font-size:clamp(34px,10vw,44px);font-weight:700;letter-spacing:-.05em}
.pg-big small{display:block;margin-top:6px;font-size:13px;color:var(--lemon);font-weight:600}
.pg-bars{display:flex;align-items:flex-end;gap:5px;height:76px;margin-top:20px}
.pg-bars i{flex:1;height:var(--h);border-radius:5px 5px 2px 2px;background:var(--lemon);transform-origin:bottom;animation:barUp .7s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:var(--d)}
@keyframes barUp{from{transform:scaleY(0)}}
.pg-range{margin-top:18px;border:0;padding:0}
.pg-form .pm-fl{margin-top:10px}.pg-form .pm-fl:first-child{margin-top:0}
.pm-sheet .pg-form{padding-bottom:6px}

/* ---------- products box (matches the empty-state screenshot) ---------- */
.pm-box{margin-top:20px;border:1px solid #e4e4df;border-radius:30px;background:#fff;box-shadow:0 14px 30px -22px rgba(10,10,10,.3);overflow:hidden}
.pm-tools{display:flex;align-items:center;border-bottom:1px solid #ececea}
.pm-tabs{flex:1;display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;padding:14px 8px 14px 14px;scrollbar-width:none}
.pm-tabs::-webkit-scrollbar{display:none}
.pm-tab{flex:none;height:42px;padding:0 18px;border:0;border-radius:999px;background:none;font:500 14.5px "Sora",sans-serif;color:#6f6f69;cursor:pointer;transition:background .2s,color .2s}
.pm-tab.on{background:#efefec;color:var(--black);font-weight:600}
.pm-tab.plus{padding:0 10px;color:#6f6f69}
.pm-tr{flex:none;display:flex;gap:8px;align-self:stretch;align-items:center;padding:0 14px 0 12px;border-left:1px solid #ececea}
.pm-pl{height:44px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:#efefec;color:var(--black);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .15s,background .2s}
.pm-pl:active{transform:scale(.92)}
.pm-pl.on{background:var(--black);color:#fff}
.pm-pl.off{opacity:.45;cursor:default}
.pm-sbar{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid #ececea;animation:pmV .25s ease-out}
.pm-si{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:1.5px solid #e4e4df;border-radius:16px;color:#6f6f69}
.pm-si:focus-within{border-color:var(--black)}
.pm-si input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 15px "Sora",sans-serif;color:var(--black)}
.pm-so{position:relative;flex:none;display:flex;align-items:center;height:46px;border:1.5px solid #e4e4df;border-radius:16px;color:#55554f}
.pm-so select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:none;height:100%;padding:0 30px 0 12px;font:500 13.5px "Sora",sans-serif;color:var(--black);max-width:132px}
.pm-so svg{position:absolute;right:8px;pointer-events:none}
.pm-selbar{margin:12px 14px 0}
.pm-es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 22px 30px}
.pm-es h2{margin-top:8px;font-size:clamp(24px,7vw,28px);font-weight:600;letter-spacing:-.04em}
.pm-es p{margin:10px 0 22px;max-width:300px;font-size:15px;line-height:1.5;font-weight:500;color:#55554f}
.pm-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pm-es2{padding:26px 22px 28px;background:#f6f6f2;border-top:1px solid #ececea}
.pm-es2 h3{font-size:19px;font-weight:600;letter-spacing:-.03em}
.pm-es2 p{margin:8px 0 18px;font-size:14.5px;line-height:1.55;font-weight:500;color:#55554f}
.pm-es2 .pm-imp{background:#e9e9e4}
.pm-nomatch{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;color:#8d8d86;font-size:14px;font-weight:500}
.pm-box .pm-list{margin:0 0 0;padding:0 14px}
.pm-box .pm-row{cursor:pointer;transition:background .15s}
.pm-box .pm-row:last-child{border-bottom:0}
.pm-box .pm-row:active{background:#fafaf7}
.pm-grid{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
.pm-gc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 10px 14px;border:1px solid #ececea;border-radius:22px;background:#fff;cursor:pointer;animation:pmV .3s ease-out;transition:transform .15s}
.pm-gc:active{transform:scale(.98)}
.pm-gc .pm-ck{position:absolute;top:16px;left:16px;z-index:1}
.pm-gimg{width:100%;aspect-ratio:1;border-radius:16px;background:#f7f7f3;border:1px solid #e9e9e4;display:grid;place-items:center;color:#8d8d86;overflow:hidden}
.pm-gimg img{width:100%;height:100%;object-fit:cover}
.pm-gc b{margin-top:6px;font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.pm-gc small{font-size:12.5px;font-weight:500;color:#6f6f69}
.pm-gc .pm-price{margin-top:0;font-size:13.5px;color:var(--black)}
.pm-del{flex:none;width:50px;height:50px;border-radius:50%;border:1px solid #e4e4df;background:#fff;color:#d6342a;display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.pm-del.arm{background:#d6342a;color:#fff;border-color:#d6342a;animation:pmShake .4s}
.pm-save .pm-del[hidden]{display:none}

/* ---------- favicons: coloured letter tile underneath, real icon fades in on top ---------- */
.pm-fav{position:relative;flex:none;display:grid;place-items:center;border-radius:14px;overflow:hidden;background:var(--b,#0a0a0a);border:0}
.pm-fav em{font:700 18px "Sora",sans-serif;font-style:normal;color:#fff}
.pm-fav img{position:absolute;inset:0;width:100%;height:100%;padding:18%;object-fit:contain;background:#fff;opacity:0;transition:opacity .3s;border-radius:0}
.pm-fav img.ok{opacity:1}
.pm-site{padding:10px 8px}

/* ---------- import / export full-screen flows ---------- */
.pm-flow{position:fixed;inset:0;z-index:60;background:#f7f7f3;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.pm-flow.on{transform:none}
.fl-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 8px;background:linear-gradient(#f7f7f3 70%,rgba(247,247,243,0))}
.fl-body{max-width:520px;margin:0 auto;padding:6px 22px calc(env(safe-area-inset-bottom,0px) + 40px);animation:flIn .5s cubic-bezier(.2,.9,.2,1)}
@keyframes flIn{from{opacity:0;transform:translateY(18px)}}
.fl-body.c{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(10px,4vh,40px)}
.fl-body h1{font-size:clamp(27px,8vw,34px);font-weight:600;letter-spacing:-.045em;line-height:1.12}
.fl-sub{margin:10px 0 24px;font-size:15px;line-height:1.55;font-weight:500;color:#6f6f69;max-width:340px;word-break:break-word}
.fl-body:not(.c) .fl-sub{max-width:none}
.fl-hero{display:grid;place-items:center;margin-bottom:6px}
.fl-hero .il{width:min(210px,64%)}
.fl-hero.sm{margin:6px 0 16px;justify-content:start}
.fl-xi{width:68px;height:68px;border-radius:22px;background:#fff;border:1px solid #ececea;display:grid;place-items:center}
.fl-drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:30px 16px;border:2px dashed #c9c9c2;border-radius:28px;background:#fff;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.fl-drop.hot,.fl-drop:active{border-color:var(--black);background:#fcfcf2;transform:scale(.99)}
.fl-dico{width:60px;height:60px;border-radius:50%;background:var(--lemon);display:grid;place-items:center;margin-bottom:8px;animation:ilFloat 3s ease-in-out infinite}
.fl-drop b{font-size:17px;font-weight:600}.fl-drop small{font-size:13px;color:var(--mute);font-weight:500}
.fl-fm{margin:12px 4px 0;font-size:13px;color:var(--mute);font-weight:500;text-align:center}
.fl-tips{list-style:none;margin:20px 0 6px;display:grid;gap:10px}
.fl-tips li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:#55554f}
.fl-tips li svg{flex:none;padding:3px;width:24px;height:24px;border-radius:50%;background:var(--lemon);color:var(--black)}
.fl-link{display:flex;align-items:center;gap:8px;margin:8px auto 0;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.fl-note{display:flex;align-items:flex-start;gap:8px;margin:14px 4px 22px;font-size:13px;line-height:1.5;font-weight:500;color:#6f6f69}
.fl-note svg{flex:none;margin-top:1px}
.fl-cta{width:100%;margin-top:6px;height:56px;font-size:16px}
.fl-cta2{width:100%;margin-top:6px}
.fl-ring{position:relative;width:176px;height:176px;margin:8px 0 26px}
.fl-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fl-ring circle{fill:none;stroke-width:7}
.fl-ring .bg{stroke:#e9e9e4}
.fl-ring .fg{stroke:var(--black);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .12s linear}
.fl-ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--lemon);opacity:.8;animation:flPulse 1.8s ease-out infinite}
@keyframes flPulse{from{transform:scale(.88);opacity:.9}to{transform:scale(1.12);opacity:0}}
.fl-core{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.fl-pct{font-size:38px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.fl-cnt{font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.fl-steps{list-style:none;display:grid;gap:12px;margin-top:6px;width:100%;max-width:300px;text-align:left}
.fl-steps li{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;color:#a9a9a2;transition:color .3s}
.fl-steps i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #d9d9d3;display:grid;place-items:center;color:transparent;transition:.3s}
.fl-steps li.act{color:var(--black);font-weight:600}
.fl-steps li.act i{border-color:var(--black);border-top-color:transparent;animation:spin .8s linear infinite}
.fl-steps li.done{color:var(--black)}
.fl-steps li.done i{background:var(--black);border-color:var(--black);color:var(--lemon)}
@keyframes spin{to{transform:rotate(360deg)}}
.fl-ok{width:140px;height:140px;margin:10px 0 22px}
.fl-ok svg{width:100%;height:100%}
.fl-ok .rg{fill:var(--lemon);stroke:var(--black);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards;transform-origin:center}
.fl-ok .ck{fill:none;stroke:var(--black);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out .55s forwards}
.fl-ok .rg,.fl-ok .ck{stroke-dasharray:200;stroke-dashoffset:200}
@keyframes draw{to{stroke-dashoffset:0}}
.fl-ok{animation:pop .6s cubic-bezier(.2,1.5,.3,1) .1s backwards}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.fl-bad{width:96px;height:96px;margin:20px 0 20px;border-radius:50%;background:#ffe3de;color:#d6342a;display:grid;place-items:center;animation:pmShake .5s}
.fl-stats{display:flex;gap:12px;width:100%;margin:2px 0 22px}
.fl-stats div{flex:1;padding:16px 10px;border:1px solid #ececea;border-radius:22px;background:#fff}
.fl-stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.045em}
.fl-stats small{font-size:12.5px;font-weight:500;color:var(--mute)}
.fl-scs{display:grid;gap:10px;margin:6px 0 20px}
.fl-sc{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px;border:1.5px solid #e4e4df;border-radius:22px;background:#fff;cursor:pointer;transition:border-color .2s}
.fl-sc input{position:absolute;opacity:0}
.fl-sc .rd{width:24px;height:24px;border-radius:50%;border:2px solid #c9c9c2;display:grid;place-items:center;transition:.2s}
.fl-sc input:checked+.rd{border-color:var(--black);background:radial-gradient(var(--black) 38%,transparent 42%)}
.fl-sc:has(input:checked){border-color:var(--black)}
.fl-sc b{font-size:15.5px;font-weight:600}.fl-sc small{font-size:13px;color:var(--mute);font-weight:500}
.fl-sc.off{opacity:.45;cursor:default}
@media(prefers-reduced-motion:reduce){.pm-flow,.dr-panel{transition:none!important}}

.toast{z-index:80}

/* collections page */
.pg-note{display:flex;gap:10px;align-items:flex-start;margin:18px 2px 4px;padding:13px 15px;border-radius:18px;background:#fff;border:1px solid #ececea;font-size:13px;line-height:1.5;font-weight:500;color:#55554f}
.pg-note svg{flex:none;margin-top:1px;color:var(--black)}
.pg-col{cursor:pointer;transition:transform .12s,border-color .2s}
.pg-col:active{transform:scale(.985)}
.pg-col:focus-visible{outline:2px solid var(--black);outline-offset:2px}

/* ===== picker.css ===== */
/* Strap – StrapPicker design: custom dropdown sheets, calendar, and the trigger fields that open them */
body.dd-lock{overflow:hidden}
.dd-layer{position:fixed;inset:0;z-index:100;font-family:"Sora","Helvetica Neue",Arial,sans-serif;color:var(--black,#0a0a0a);-webkit-tap-highlight-color:transparent}
.dd-scrim{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .3s}
.dd-layer.on .dd-scrim{opacity:1}
.dd-sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -24px 60px -20px rgba(10,10,10,.45);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);outline:0}
.dd-layer.on .dd-sheet{transform:none}
.dd-grab{flex:none;display:grid;place-items:center;height:28px}
.dd-grab i{width:44px;height:5px;border-radius:9px;background:#dcdcd6}
.dd-h{flex:none;display:flex;align-items:center;gap:12px;padding:0 20px 12px}
.dd-h h2{flex:1;font-size:21px;font-weight:600;letter-spacing:-.035em;line-height:1.2}
.dd-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#f1f1ed;color:inherit;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.dd-x:active{transform:scale(.9)}
.dd-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:2px 20px 20px;overflow-y:auto;overscroll-behavior:contain}
.dd-pick .dd-b{overflow:hidden}
.dd-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px;margin:-2px;-webkit-overflow-scrolling:touch}
.dd-empty{padding:28px 12px;text-align:center;font-size:14px;line-height:1.55;font-weight:500;color:#8d8d86}

/* search */
.dd-s{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:#f4f4f0;border:1.5px solid transparent;color:#6f6f69;transition:border-color .2s,background .2s}
.dd-s:focus-within{background:#fff;border-color:var(--black,#0a0a0a)}
.dd-s input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px "Sora",sans-serif;color:var(--black,#0a0a0a)}
.dd-s input::-webkit-search-cancel-button{display:none}

/* list rows */
.dd-list.list{display:grid;gap:8px;align-content:start}
.dd-o{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 14px 10px 12px;border:1.5px solid #ececea;border-radius:22px;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .12s,box-shadow .2s}
.dd-o:active,.dd-chip:active,.dd-card:active{transform:scale(.97)}
.dd-o:disabled{opacity:.45}
.dd-o.on{border-color:var(--black,#0a0a0a);background:#fafaf3;box-shadow:inset 0 0 0 1px var(--black,#0a0a0a)}
.dd-ot{flex:1;min-width:0}
.dd-ot b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.dd-ot small,.dd-card small,.dd-chip small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;line-height:1.35;color:#8d8d86}
.dd-tile{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#f1f1ed;color:var(--black,#0a0a0a);font-size:16px;font-weight:700;overflow:hidden;font-style:normal}
.dd-tile img{width:100%;height:100%;object-fit:cover}
.tone-n{background:#f1f1ed;color:#3a3a36}.tone-lemon{background:var(--lemon,#e6f53a);color:#0a0a0a}.tone-green{background:#dcf2e5;color:#1f7a4d}
.tone-blue{background:#e0ebff;color:#1d4ed8}.tone-pink{background:#fde4f3;color:#b21fa8}.tone-amber{background:#fdecc8;color:#a4600a}.tone-grey{background:#e9e9e4;color:#55554f}
.dd-sdot{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff)}
.dd-sdot::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 24%,transparent);border:1px solid rgba(10,10,10,.12)}
.dd-ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #d9d9d3;color:transparent;transition:.25s cubic-bezier(.2,1.5,.3,1)}
.dd-list:not(.multi) .dd-ck{border-color:transparent;opacity:0;transform:scale(.55)}
.on>.dd-ck{background:var(--black,#0a0a0a);border-color:var(--black,#0a0a0a);color:var(--lemon,#e6f53a);opacity:1;transform:none}

/* chips (units) */
.dd-list.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.dd-chip{flex:1 1 calc(50% - 10px);min-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:18px 12px;border:1.5px solid #ececea;border-radius:24px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .12s}
.dd-chip b{font-size:24px;font-weight:700;letter-spacing:-.04em}
.dd-chip small{margin:0}
.dd-chip.on{background:var(--black,#0a0a0a);border-color:var(--black,#0a0a0a);color:#fff}
.dd-chip.on b{color:var(--lemon,#e6f53a)}.dd-chip.on small{color:rgba(255,255,255,.62)}

/* cards (package, layout) */
.dd-list.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.dd-card{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 12px 14px;border:1.5px solid #ececea;border-radius:26px;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .12s}
.dd-card b{margin-top:8px;font-size:15px;font-weight:600;letter-spacing:-.02em}
.dd-art{height:96px;border-radius:18px;background:#f4f4f0;display:grid;place-items:center;overflow:hidden;transition:background .25s}
.dd-art svg{width:84%;height:84%}
.dd-card .dd-ck{position:absolute;top:18px;right:18px;width:26px;height:26px;background:#fff}
.dd-card.on{border-color:var(--black,#0a0a0a);box-shadow:inset 0 0 0 1px var(--black,#0a0a0a)}
.dd-card.on .dd-art{background:color-mix(in srgb,var(--lemon,#e6f53a) 38%,#fff)}

/* create row + done */
.dd-new{flex:none;display:flex;gap:8px}
.dd-new input{flex:1;min-width:0;height:54px;border:1.5px dashed #c9c9c2;border-radius:18px;padding:0 16px;background:#fafaf7;font:500 15.5px "Sora",sans-serif;color:var(--black,#0a0a0a);outline:0;transition:border-color .2s,background .2s}
.dd-new input:focus{border-style:solid;border-color:var(--black,#0a0a0a);background:#fff}
.dd-new.bad input{border-color:#d6342a;animation:ddShake .4s}
@keyframes ddShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<body class="is-dash">
<main class="dash go focus" id="dash">
  <div class="dtop"></div>
  <section class="dsheet" id="sheet"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== connection stand-in (the real api.js talks to your server) =====
   Only here so this file runs on its own. When you connect your real api.js, delete this block.
   [HOOK 5] upload(): shrinks a product photo and keeps it inside the page. Replace it with an upload to your server
   that returns the picture's web address. */
window.StrapAPI = {
  upload: async file => {
    try {
      if (!file || !/^image\//.test(file.type)) return null;
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
      const s = Math.min(1, 600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.8);
    } catch (e) { return null; }
  },
  signOut: async () => ({ ok: true }),
  auth: {
    sendCode: async () => ({ ok: true }),
    verifyCode: async (email, code) => ({ ok: code === '123456' }),
    changePassword: async () => ({ ok: true })
  }
};

/* ===== picker.js ===== */
/* Strap – StrapPicker: one custom dropdown system for the whole app.
   - StrapPicker.pick({...})  bottom-sheet list / chips / cards, single or multi select, optional "create new" row
   - StrapPicker.date({...})  custom calendar sheet (replaces the native date popup)
   - Every native <select>, <input type="date"> and <input list> that appears in the page is upgraded automatically
     (the original element stays in the DOM, hidden, so forms, validation and saving keep working unchanged).
   - PRESETS below give each dropdown its own look (icons, status dots, size cards, layout previews, ...). */
window.StrapPicker = (() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const tap = () => { try { window.StrapKit && StrapKit.fx && StrapKit.fx('tap'); } catch (e) {} };

  /* ---------- icons ---------- */
  const PATHS = {
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M6 12h12"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>', chev: '<path d="m6 9 6 6 6-6"/>', chevL: '<path d="m15 6-6 6 6 6"/>', chevR: '<path d="m9 6 6 6-6 6"/>',
    cal: '<rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', az: '<path d="M4 17 7.5 7 11 17M5.3 13.8h4.4"/><path d="M14 8h5l-5 8h5"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    shirt: '<path d="M8.5 4 4 6.5 6 10.5l2-1V20h8V9.5l2 1 2-4L15.5 4a3.5 3.5 0 0 1-7 0z"/>', drop: '<path d="M12 3.5s5.5 6 5.5 10a5.5 5.5 0 0 1-11 0c0-4 5.5-10 5.5-10z"/>',
    phone: '<rect x="7" y="3.5" width="10" height="17" rx="2.6"/><path d="M11 17.5h2"/>', cup: '<path d="M5 8.5h11V14a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M12 3.5v2"/>',
    dumb: '<path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/>', home: '<path d="M4 11 12 4.5 20 11v8.5H4z"/><path d="M10 19.5v-5h4v5"/>',
    pencil: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="m14.5 6.5 3 3"/>', dots: '<circle cx="7" cy="7" r="1.6"/><circle cx="17" cy="7" r="1.6"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>',
    box: '<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="m3.5 8 8.5 4.5L20.5 8M12 12.5v8"/>', cloud: '<path d="M12 4.5v9M8 10l4 4 4-4"/><path d="M5 19.5h14"/>',
    user: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>', tag: '<path d="M3.5 12.2V5.5a2 2 0 0 1 2-2h6.7l8 8a2 2 0 0 1 0 2.8l-5.2 5.2a2 2 0 0 1-2.8 0z"/><circle cx="8.3" cy="8.3" r="1.4"/>',
    collections: '<rect x="3.5" y="8" width="13" height="12" rx="2.5"/><path d="M7.5 4.5h11a2 2 0 0 1 2 2V16"/>', store: '<path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12.5V20h13v-7.5"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z"/>',
    trend: '<path d="M4 19.5h16"/><path d="m5 15 4.5-4.5 3.5 3L19 7"/><path d="M14.5 7H19v4.5"/>', branch: '<circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="9" r="2.3"/><path d="M6 8.3v7.4M18 11.3c0 3.5-4 3-9.5 5"/>'
  };
  const ic = (k, s = 20, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[k] || ''}</svg>`;

  /* ---------- layers (bottom sheets) ---------- */
  let locks = 0; const stack = [];
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) { e.stopPropagation(); stack[stack.length - 1](); } }, true);
  function layer(cls, title, html) {
    const w = document.createElement('div'); w.className = 'dd-layer ' + cls;
    w.innerHTML = `<div class="dd-scrim"></div><section class="dd-sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="dd-grab"><i></i></div>
      <header class="dd-h"><h2>${esc(title)}</h2><button type="button" class="dd-x" data-x aria-label="Close">${ic('close', 20, 2.2)}</button></header><div class="dd-b">${html}</div></section>`;
    document.body.appendChild(w); locks++; document.body.classList.add('dd-lock'); void w.offsetWidth; w.classList.add('on');
    let closed = false;
    const api = {
      el: w, body: $('.dd-b', w), onClose: null,
      close() {
        if (closed) return; closed = true; w.classList.remove('on');

      }
    };
    stack.push(api.close);
    w.addEventListener('click', e => { if (e.target.closest('.dd-scrim') || e.target.closest('[data-x]')) api.close(); });
    return api;
  }

  /* ---------- list / chips / cards picker ---------- */
  const TONES = ['lemon', 'blue', 'green', 'pink', 'amber', 'grey'];
  const toneOf = s => TONES[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];
  const tile = o => {
    if (o.html) return `<i class="dd-tile tone-${o.tone || 'n'}">${o.html}</i>`;
    if (o.img) return `<i class="dd-tile"><img src="${esc(o.img)}" alt=""></i>`;
    if (o.sw) return `<i class="dd-sdot" style="--c:${esc(o.sw)}"></i>`;
    if (o.ic) return `<i class="dd-tile tone-${o.tone || 'n'}">${ic(o.ic, 22, 1.8)}</i>`;
    if (o.letter) return `<i class="dd-tile tone-${o.tone || toneOf(o.letter)}">${esc(o.letter)}</i>`;
    return '';
  };
  const optHtml = (o, variant, on) => {
    const ck = `<span class="dd-ck">${ic('check', 16, 3)}</span>`;
    const at = `type="button" role="option" data-v="${esc(o.v)}" aria-selected="${on}"${o.disabled ? ' disabled' : ''}`;

    if (variant === 'cards') return `<button ${at} class="dd-card${on ? ' on' : ''}"><span class="dd-art">${o.art || ''}</span><b>${esc(o.l)}</b>${sub}${ck}</button>`;
    return `<button ${at} class="dd-o${on ? ' on' : ''}">${tile(o)}<span class="dd-ot"><b${o.css ? ` style="${esc(o.css)}"` : ''}>${esc(o.l)}</b>${sub}</span>${ck}</button>`;
  };

  // options: [{ v, l, s?, ic?, tone?, sw?, img?, letter?, html?, art?, css?, disabled? }]
  // resolves with the chosen value (array when multi), or undefined when dismissed
  function pick({ title = 'Choose', options = [], value, multi = false, variant = 'list', search, create, empty = 'Nothing here yet.', done = 'Done' } = {}) {
    return new Promise(resolve => {
      const opts = options.map(o => ({ ...o, _v: o.v, v: String(o.v) }));
      const sel = new Set(multi ? (value || []).map(String) : [String(value)]);
      let q = '', result;
      const showSearch = search == null ? opts.length > 8 : search;
      const L = layer('dd-pick ' + variant, title, `${showSearch ? `<label class="dd-s">${ic('search', 19, 2)}<input type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search"></label>` : ''}
        <div class="dd-list ${variant}${multi ? ' multi' : ''}" role="listbox" aria-multiselectable="${multi}"></div>

      const list = $('.dd-list', L.body), doneBtn = $('[data-done]', L.body);
      const draw = () => {
        const n = q.trim().toLowerCase(), rows = n ? opts.filter(o => (o.l + ' ' + (o.s || '')).toLowerCase().includes(n)) : opts;

/* ===== store.js ===== */
/* Strap – shared store for sales, held sales, credit book, activity PIN, receipt template and preferences.
   Everything is kept in localStorage for now. Swap the `api` hooks (and the save() call) for real backend calls later. */
window.StrapStore = (() => {
  const KEY = 'strap.v1';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const blank = () => ({
    sales: [], payments: [], held: [], collections: [], credits: [], seq: 0, closed: null, pin: null, lock: { n: 0, until: 0 }, receipt: null, online: null, orders: [], oseq: 1000,
    prefs: { sound: true, vibrate: true, creditReminders: true, orderAlerts: true, lowStock: true }
  });
  let S = blank();
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    S = Object.assign(blank(), raw); S.prefs = Object.assign(blank().prefs, raw.prefs || {});
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ===== Backend hooks – replace with real calls ===== */
  const A = window.StrapAPI.auth;
  const api = {
    DEMO: false,
    sendCode: A.sendCode, verifyCode: A.verifyCode, changePassword: A.changePassword,
    async savePin(pinHash) { return { ok: true }; }, // PIN hash is saved with the rest of your data in Neon
    async scheduleCreditReminder(credit) { return { ok: true }; }
  };

  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const lineCount = s => s.lines.reduce((a, l) => a + l.qty, 0);

  // ---- hashing for the 4-digit PIN (the real check should live on your server) ----
  async function hashPin(pin, salt) {
    const data = new TextEncoder().encode(salt + ':' + pin);
    try { const buf = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(buf)].map(b => pad(b.toString(16))).join(''); }
    catch (e) { let h = 5381; for (const c of salt + ':' + pin) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
  }

  // product collections – created on the Collections page, chosen when adding a product
  const collections = {
    all: () => S.collections,
    find: name => S.collections.find(c => c.name.toLowerCase() === String(name).trim().toLowerCase()),
    add(name, description = '') {
      const n = String(name).trim().slice(0, 40); if (!n) return null;
      const ex = collections.find(n); if (ex) return ex;
      const c = { id: uid('col'), name: n, description: String(description).trim().slice(0, 80), createdAt: Date.now() };
      S.collections.unshift(c); save(); return c;
    },
    remove(id) { S.collections = S.collections.filter(c => c.id !== id); save(); }
  };

  const credits = {
    balance: c => Math.max(0, Math.round((c.total - c.payments.reduce((a, p) => a + p.amount, 0)) * 100) / 100),
    paid: c => c.payments.reduce((a, p) => a + p.amount, 0),
    open: () => S.credits.filter(c => credits.balance(c) > 0).sort((a, b) => a.due.localeCompare(b.due)),
    settled: () => S.credits.filter(c => credits.balance(c) <= 0).sort((a, b) => b.createdAt - a.createdAt),
    owed: () => S.credits.reduce((a, c) => a + credits.balance(c), 0),
    // days until due: negative = overdue
    daysLeft: c => Math.round((new Date(c.due + 'T00:00:00') - new Date(dayKey() + 'T00:00:00')) / 864e5),
    due: (within = 0) => credits.open().filter(c => credits.daysLeft(c) <= within)
  };

  return {
    api, dayKey, credits, collections, lineCount, prefs: S.prefs,
    get state() { return S; },
    save,
    nextNo() { S.seq++; save(); return 'S-' + pad(S.seq, 4); },

    // ----- sales & money -----
    addSale(sale) { S.sales.unshift(sale); save(); return sale; },
    addPayment(p) { S.payments.push({ id: uid('pay'), ts: Date.now(), ...p }); save(); },
    sales(days = 0) {
      if (!days) return S.sales;
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
      return S.sales.filter(s => s.ts >= from.getTime());
    },
    earned(days = 1) {
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
      return S.payments.filter(p => !days || p.ts >= from.getTime()).reduce((a, p) => a + p.amount, 0);
    },
    earnedAll() { return S.payments.reduce((a, p) => a + p.amount, 0); },
    dayStats() {
      const sales = S.sales.filter(s => dayKey(s.ts) === dayKey());
      const creditToday = sales.filter(s => s.method === 'credit');
      return {
        sales, count: sales.length, items: sales.reduce((a, s) => a + lineCount(s), 0),
